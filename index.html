<script>/* Grupo E CRM — versão com login próprio (Firebase). Substitui o ambiente do claude.ai. */
(function(){
const CFG=window.FIREBASE_CONFIG;const DONO='emelchioretto@gmail.com';
window.__HOSTED=true;
firebase.initializeApp(CFG);
const auth=firebase.auth();const fs=firebase.firestore();
try{fs.settings({ignoreUndefinedProperties:true,merge:true})}catch(e){}
try{fs.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}

/* Firestore não aceita lista dentro de lista: guarda como {__arr:[...]} */
const isP=v=>v&&typeof v==='object'&&!Array.isArray(v)&&!(v instanceof Date)&&Object.getPrototypeOf(v)===Object.prototype;
function enc(v){if(Array.isArray(v))return v.map(x=>Array.isArray(x)?{__arr:enc(x)}:enc(x));if(isP(v)){const o={};for(const k in v){if(v[k]!==undefined)o[k]=enc(v[k])}return o}return v}
function dec(v){if(Array.isArray(v))return v.map(x=>isP(x)&&Object.keys(x).length===1&&Array.isArray(x.__arr)?dec(x.__arr):dec(x));if(isP(v)){const o={};for(const k in v)o[k]=dec(v[k]);return o}return v}
const MAPC={'invalid-argument':'invalid_argument','not-found':'not_found','resource-exhausted':'quota_exceeded','permission-denied':'not_granted','unavailable':'store_unavailable','deadline-exceeded':'store_unavailable'};
const mErr=e=>{const c=(e&&e.code)||'';const o=new Error((e&&e.message)||String(e));o.code=MAPC[c]||c.replace(/-/g,'_')||'unknown';return o};
const P=p=>p.then(x=>x,e=>{throw mErr(e)});
function wSnap(s){return {id:s.id,exists:s.exists,data:()=>s.exists?dec(s.data()):undefined,ref:wDoc(s.ref)}}
function wQS(s){return {docs:s.docs.map(wSnap),size:s.size,empty:s.empty,docChanges:()=>s.docChanges().map(c=>({type:c.type,doc:wSnap(c.doc)}))}}
function wDoc(r){return {id:r.id,path:r.path,get:()=>P(r.get()).then(wSnap),set:d=>P(r.set(enc(d))),update:d=>P(r.update(enc(d))),delete:()=>P(r.delete()),
  onSnapshot:(n,e)=>r.onSnapshot(s=>n(wSnap(s)),x=>e&&e(mErr(x))),collection:c=>wColl(r.collection(c))}}
function wQ(q){return {where:(f,o,v)=>wQ(q.where(f,o,enc(v))),orderBy:(f,d)=>wQ(q.orderBy(f,d||'asc')),limit:n=>wQ(q.limit(n)),get:()=>P(q.get()).then(wQS),
  onSnapshot:(n,e)=>q.onSnapshot(s=>n(wQS(s)),x=>e&&e(mErr(x)))}}
function wColl(c){return {...wQ(c),path:c.path,id:c.id,doc:id=>wDoc(id?c.doc(id):c.doc()),add:d=>P(c.add(enc(d))).then(wDoc)}}
const DB={collection:p=>wColl(fs.collection(p)),doc:p=>wDoc(fs.doc(p)),_fs:fs,_enc:enc};
window.__CRM_HOST={fs,auth,DONO,eu:()=>EU};

/* ---------- tela de entrada ---------- */
const css=`#gx{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:20px;background:#0f1412;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#1c1f1d}
#gx .c{background:#fff;border-radius:16px;max-width:400px;width:100%;padding:32px 28px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
#gx h1{font:600 22px/1.2 system-ui;letter-spacing:.14em;margin:0}#gx .s{font-size:11px;letter-spacing:.2em;color:#6b716d;margin:4px 0 22px}
#gx button{display:inline-flex;align-items:center;gap:10px;border:1px solid #d6d9d6;background:#fff;border-radius:10px;padding:12px 18px;font:600 15px system-ui;cursor:pointer;color:#1c1f1d}
#gx button:hover{background:#f4f5f2}#gx p{color:#59605b;font-size:13.5px;margin:16px 0 0}#gx .er{color:#b3261e}
#gx progress{width:100%;margin-top:14px}`;
const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
const G='<svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>';
function tela(html){let el=document.getElementById('gx');if(!el){el=document.createElement('div');el.id='gx';document.body.appendChild(el)}el.innerHTML=`<div class="c"><h1>ELTON</h1><div class="s">MELCHIORETTO · GRUPO E</div>${html}</div>`;return el}
function fechar(){const el=document.getElementById('gx');if(el)el.remove()}
const entrar=async()=>{const pv=new firebase.auth.GoogleAuthProvider();pv.setCustomParameters({prompt:'select_account'});
  try{const r=await auth.signInWithPopup(pv);const t=r&&r.credential&&r.credential.accessToken;if(t&&window.__crmSetToken)window.__crmSetToken(t,3300)}catch(e){if(/popup|cancel/i.test(e.code||'')&&!/cancelled-popup|closed-by-user/.test(e.code||''))await auth.signInWithRedirect(pv);else if(!/closed-by-user|cancelled-popup/.test(e.code||''))tela(`<p class="er">Não consegui entrar: ${String(e.message||e).replace(/</g,'&lt;')}</p><p><button id="gxb">${G} Tentar de novo</button></p>`),document.getElementById('gxb').onclick=entrar}};
const LKEY='crm-email-link';
function telaLogin(msg){tela(`<p style="margin-top:0">Entre para abrir o CRM.</p><p><button id="gxb">${G} Entrar com Google</button></p>
  <p style="margin:18px 0 8px">ou receba um link de acesso no seu e-mail:</p>
  <form id="gxe" style="display:grid;gap:8px"><input type="email" id="gxm" required placeholder="seu e-mail" autocomplete="email" style="padding:11px 12px;border:1px solid #d6d9d6;border-radius:10px;font:15px system-ui"><button type="submit" style="justify-content:center">Enviar link</button></form>
  <p id="gxr">${msg||'Só os administradores cadastrados conseguem entrar.'}</p>`);
  document.getElementById('gxb').onclick=entrar;
  document.getElementById('gxe').onsubmit=async e=>{e.preventDefault();const em=document.getElementById('gxm').value.trim().toLowerCase();const r=document.getElementById('gxr');
    try{await auth.sendSignInLinkToEmail(em,{url:location.origin+location.pathname,handleCodeInApp:true});try{localStorage.setItem(LKEY,em)}catch(_){}
      r.innerHTML=`Pronto! Abra o e-mail que enviamos para <b>${em.replace(/</g,'&lt;')}</b> e clique no link <b>neste mesmo aparelho</b>. Se não aparecer, olhe no spam.`}
    catch(x){r.className='er';r.textContent='Não consegui enviar o link: '+(x.message||x)}}}
async function linkEmail(){if(!auth.isSignInWithEmailLink||!auth.isSignInWithEmailLink(location.href))return false;let em='';try{em=localStorage.getItem(LKEY)||''}catch(_){}
  if(!em){tela(`<p style="margin-top:0">Confirme o seu e-mail para entrar:</p><form id="gxc" style="display:grid;gap:8px"><input type="email" id="gxcm" required placeholder="seu e-mail" style="padding:11px 12px;border:1px solid #d6d9d6;border-radius:10px;font:15px system-ui"><button type="submit" style="justify-content:center">Entrar</button></form>`);
    em=await new Promise(r=>document.getElementById('gxc').onsubmit=e=>{e.preventDefault();r(document.getElementById('gxcm').value.trim().toLowerCase())})}
  try{tela('<p>Entrando…</p>');await auth.signInWithEmailLink(em,location.href);try{localStorage.removeItem(LKEY)}catch(_){}history.replaceState(null,'',location.pathname);return true}
  catch(x){history.replaceState(null,'',location.pathname);telaLogin('<span class="er">Este link expirou ou já foi usado. Peça um novo.</span>');return true}}
window.crmSair=()=>auth.signOut().then(()=>location.reload());

/* ---------- migração ---------- */
async function lerArquivo(f){let buf=new Uint8Array(await f.arrayBuffer());if(buf[0]===0x50&&buf[1]===0x4b){const dv=new DataView(buf.buffer);const m=buf[8]|(buf[9]<<8),cs=dv.getUint32(18,true),nl=dv.getUint16(26,true),xl=dv.getUint16(28,true);const ini=30+nl+xl;const data=buf.subarray(ini,ini+cs);buf=m===8?new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer()):data;return JSON.parse(new TextDecoder().decode(buf))}if(buf[0]===0x1f&&buf[1]===0x8b){const st=new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));buf=new Uint8Array(await new Response(st).arrayBuffer())}return JSON.parse(new TextDecoder().decode(buf))}
async function importar(M,prog){const cols=M.colecoes||{};const nomes=Object.keys(cols).filter(c=>c!=='config').concat(cols.config?['config']:[]);
  const N=nomes.reduce((a,c)=>a+cols[c].length,0);let feitos=0;
  for(const c of nomes){const L=cols[c].filter(d=>d&&d.id);if(!L.length)continue;
    const tem=async k=>{try{return (await fs.collection(c).doc(L[k].id).get()).exists}catch(e){return false}};
    let ini=0;if(await tem(L.length-1)){feitos+=L.length;prog(feitos,N);continue}
    if(await tem(0)){let lo=0,hi=L.length-1;while(hi-lo>1){const md=(lo+hi)>>1;if(await tem(md))lo=md;else hi=md}ini=hi}
    feitos+=ini;prog(feitos,N);let i=ini;
    while(i<L.length){const b=fs.batch();let bytes=0,k=0;
      while(i+k<L.length&&k<200){const {id,...data}=L[i+k];const e=enc(data);const sz=JSON.stringify(e).length;if(k>0&&bytes+sz>1.5e6)break;bytes+=sz;b.set(fs.collection(c).doc(id),e);k++}
      let t=0;for(;;){try{await b.commit();break}catch(err){if(err&&err.code==='resource-exhausted')throw new Error('Chegou no limite grátis de gravações do Firebase por hoje ('+feitos+' de '+N+' copiados). Nada se perdeu: amanhã escolha o mesmo arquivo de novo e ele continua de onde parou.');if(++t>5)throw err;await new Promise(r=>setTimeout(r,1500*t))}}
      i+=k;feitos+=k;prog(feitos,N);await new Promise(r=>setTimeout(r,50))}}
  return N}
function telaMigrar(user){const el=tela(`<p style="margin-top:0">Olá, ${user.displayName||''}! ${window.__migCont?'Vamos continuar a cópia dos dados.':'O banco ainda está vazio.'}</p><p>Abra o CRM no claude.ai, vá em <b>Configurações › Backup</b>, clique em <b>Exportar para o app novo</b> e escolha aqui o arquivo baixado.</p><p><label><button id="gxf">Escolher arquivo de migração</button><input type="file" id="gxi" accept=".zip,.gz,.json" hidden></label></p><div id="gxm"></div><p><a href="#" id="gxs" style="color:#6b716d">Sair</a></p>`);
  el.querySelector('#gxs').onclick=e=>{e.preventDefault();window.crmSair()};el.querySelector('#gxf').onclick=()=>el.querySelector('#gxi').click();
  return new Promise(res=>{el.querySelector('#gxi').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;const m=el.querySelector('#gxm');
    try{m.innerHTML='<p>Lendo arquivo…</p>';const M=await lerArquivo(f);if(M.formato!=='migracao')throw new Error('Este não é o arquivo de migração.');
      try{localStorage.setItem('crm-mig-pend','1')}catch(_){}
      m.innerHTML='<p>Copiando dados… não feche esta janela.</p><progress id="gxp" max="1" value="0"></progress><p id="gxn"></p>';
      const n=await importar(M,(a,b)=>{const p=document.getElementById('gxp');p.max=b;p.value=a;document.getElementById('gxn').textContent=a+' de '+b})
      ;try{localStorage.removeItem('crm-mig-pend')}catch(_){}m.innerHTML=`<p>Pronto! ${n} registros copiados.</p>`;setTimeout(res,800)}catch(e){m.innerHTML=`<p class="er">${String(e.message||e).replace(/</g,'&lt;')}</p>`}}})}

/* lista de quem pode entrar: e-mails dos Administradores em Configurações › Usuários */
function syncAcesso(user){fs.doc('config/geral').onSnapshot(s=>{if(!s.exists)return;const eq=(s.data().equipe||[]);
  const em=[...new Set([DONO,...eq.filter(m=>m&&m.tipo==='Administrador'&&m.ativo!==false&&m.email).map(m=>String(m.email).trim().toLowerCase())])].sort();
  fs.doc('acesso/admins').get().then(a=>{const cur=a.exists?(a.data().emails||[]).slice().sort():[];if(JSON.stringify(cur)!==JSON.stringify(em))fs.doc('acesso/admins').set({emails:em,em:new Date().toISOString(),por:user.email})}).catch(()=>{})},()=>{})}

/* ---------- pronto para o CRM ---------- */
let pronto;const ready=new Promise(r=>pronto=r);let EU=null;
auth.getRedirectResult().then(r=>{const t=r&&r.credential&&r.credential.accessToken;if(t&&window.__crmSetToken)window.__crmSetToken(t,3300)}).catch(()=>{});
const quandoPronto=f=>document.body?f():document.addEventListener('DOMContentLoaded',f);
quandoPronto(()=>{tela('<p>Carregando…</p>');
auth.onAuthStateChanged(async user=>{
  if(!user){if(await linkEmail())return;telaLogin();return}
  const email=String(user.email||'').toLowerCase();
  EU={id:user.uid,name:user.displayName||'',email,isOwner:email===DONO,canEdit:true,avatarUrl:user.photoURL||'',color:'#2f6f5e'};
  tela('<p>Verificando acesso…</p>');
  let g,ultErr;for(let t=0;t<3&&!g;t++){try{g=await fs.doc('config/geral').get(t?{source:'server'}:undefined)}catch(e){ultErr=e;if(e&&e.code==='permission-denied')break;await new Promise(r=>setTimeout(r,1500))}}
  if(!g&&ultErr&&ultErr.code!=='permission-denied'){tela(`<p style="margin-top:0">Não consegui abrir o banco agora.</p><p style="font-size:12px;color:#777">${String(ultErr.code||'')} ${String(ultErr.message||ultErr).replace(/</g,'&lt;').slice(0,200)}</p><p><button id="gxr2">Tentar de novo</button></p><p><a href="#" id="gxs2" style="color:#6b716d">Sair</a></p>`);document.getElementById('gxr2').onclick=()=>location.reload();document.getElementById('gxs2').onclick=ev=>{ev.preventDefault();window.crmSair()};return}
  if(!g)try{throw ultErr}catch(e){
    tela(`<p style="margin-top:0"><b>${user.email}</b> não tem acesso a este CRM.</p><p style="font-size:11.5px;color:#888">Detalhe: ${String((e&&e.code)||'')} · e-mail verificado: ${user.emailVerified?'sim':'não'} · ${(user.providerData||[]).map(p=>p.providerId).join(', ')}</p><p>Peça ao Elton para cadastrar este e-mail como <b>Administrador</b> em Configurações › Usuários.</p><p><button id="gxo">Entrar com outra conta</button></p>`);document.getElementById('gxo').onclick=()=>auth.signOut();return}
  let pend=false;try{pend=localStorage.getItem('crm-mig-pend')==='1'}catch(_){}
  if(!g.exists||(pend&&EU.isOwner)){if(!EU.isOwner){tela('<p>O CRM ainda está sendo preparado. Tente mais tarde.</p>');return}window.__migCont=g.exists;await telaMigrar(user)}
  window.crmMigrar=()=>{window.__migCont=true;telaMigrar(user).then(()=>location.reload())};
  syncAcesso(user);fechar();pronto(DB);try{const H=window.__CRM_HOST;H.onLogin&&H.onLogin()}catch(_){}});});

/* ---------- o que o CRM pede ---------- */
const dl={save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return {ok:true}}};
window.claude={use:async n=>{if(n==='db')return ready;if(n==='user'){await ready;return {me:async()=>EU,isOwner:async()=>EU.isOwner,canEdit:async()=>true,id:async()=>EU.id,name:async()=>EU.name,email:async()=>EU.email,can:async()=>true,profiles:async ids=>Object.fromEntries([].concat(ids).map(i=>[i,{id:i,name:'',avatarUrl:'',color:'#888',email:null,isMe:i===EU.id,guest:false}]))}}
  if(n==='downloads')return dl;const X=(window.__CRM_HOST||{}).extra||{};if(n==='mcp'){await ready;return X.mcp||null}if(n==='assets'){await ready;return X.assets||null}return null}};
})();
</script>
<script>/* Grupo E CRM — conectores fora do claude.ai: Gmail, Agenda e Drive (conta Google de quem entrou),
   DocuSeal (chave da API guardada no banco) e anexos (Firebase Storage). */
(function(){
const H=window.__CRM_HOST;if(!H)return;const {fs,auth,DONO}=H;
const erro=(msg,code)=>{const e=new Error(msg);e.code=code||'tool_error';return e};
window.__crmSetToken=()=>{};

/* ---------- ponte Apps Script (conta Google da empresa) ---------- */
async function segredos(){const d=await fs.doc('config/segredos').get();return d.exists?d.data():{}}
function pedir(titulo,texto,campos){return new Promise(res=>{const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px;font:14px/1.5 system-ui';
  o.innerHTML=`<div style="background:#fff;color:#1c1f1d;border-radius:14px;max-width:460px;width:100%;padding:22px"><h3 style="margin:0 0 8px">${titulo}</h3><p style="margin:0 0 10px;color:#555">${texto}</p>${campos.map((c,k)=>c.check?`<label style="display:flex;gap:6px;align-items:center;margin:8px 0;color:#555"><input type="checkbox" data-k="${k}"> ${c.label}</label>`:`<label style="display:block;margin:8px 0 4px;font-weight:600;font-size:13px">${c.label}</label><input data-k="${k}" style="width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:8px;font:13px monospace" placeholder="${c.ph||''}">`).join('')}
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button data-c style="padding:8px 14px;border-radius:8px;border:1px solid #ccc;background:#fff;cursor:pointer">Cancelar</button><button data-o style="padding:8px 14px;border-radius:8px;border:0;background:#1f6f54;color:#fff;cursor:pointer;font-weight:600">Salvar</button></div></div>`;
  document.body.appendChild(o);o.querySelector('[data-c]').onclick=()=>{o.remove();res(null)};
  o.querySelector('[data-o]').onclick=()=>{const v=campos.map((c,k)=>{const el=o.querySelector(`[data-k="${k}"]`);return c.check?el.checked:el.value.trim()});if(campos.some((c,k)=>!c.check&&!c.opc&&!v[k]))return;o.remove();res(v)}})}
async function ponteCfg(){let x=await segredos();x={...x,gasUrl:x.gasUrl||window.GAS_URL||''};if(x.gasUrl&&x.gasSegredo)return x;
  if(x.gasUrl){const v=await pedir('Ligar o Google do CRM','Cole o <b>código secreto</b> que o Claude te passou. É feito uma vez só.',[{label:'Código secreto'}]);if(!v)throw erro('O Google do CRM ainda não foi ligado.','sem_config');await fs.doc('config/segredos').set({gasUrl:x.gasUrl,gasSegredo:v[0]},{merge:true});return {...x,gasSegredo:v[0]}}
  const v=await pedir('Ligar o Google do CRM','Cole o endereço do <b>Apps Script</b> (termina em <code>/exec</code>) e o código secreto que o Claude te passou. É feito uma vez só.',[{label:'Endereço do app da Web',ph:'https://script.google.com/macros/s/.../exec'},{label:'Código secreto'}]);
  if(!v)throw erro('O Google do CRM ainda não foi ligado.','sem_config');await fs.doc('config/segredos').set({gasUrl:v[0],gasSegredo:v[1]},{merge:true});return {...x,gasUrl:v[0],gasSegredo:v[1]}}
async function ponte(server,tool,input,extra){const c=await ponteCfg();let r;
  try{r=await fetch(c.gasUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({segredo:c.gasSegredo,server,tool,input,...(extra||{})})})}
  catch(e){throw erro('Não consegui falar com o Google agora ('+(e.message||e)+'). Tente de novo em instantes.')}
  let j;try{j=await r.json()}catch(e){throw erro('O Apps Script não respondeu direito (confira se a implantação está como "Qualquer pessoa").')}

/* ---------- DocuSeal (pela mesma ponte) ---------- */
async function dsChave(){let x=await segredos();if(x.docusealKey)return {key:x.docusealKey,base:x.docusealBase||'https://api.docuseal.com'};
  const v=await pedir('Chave da API do DocuSeal','No DocuSeal: <b>Configurações › API</b>, copie a chave e cole aqui. É pedida uma vez só e fica guardada no banco, que só os administradores leem.',[{label:'Chave da API'},{label:'minha conta é do DocuSeal Europa (docuseal.eu)',check:true}]);
  if(!v)throw erro('Sem a chave da API do DocuSeal.');const base=v[1]?'https://api.docuseal.eu':'https://api.docuseal.com';await fs.doc('config/segredos').set({docusealKey:v[0],docusealBase:base},{merge:true});return {key:v[0],base}}
async function ds(tool,input){const k=await dsChave();try{return await ponte('DocuSeal',tool,input,{docuseal:k})}catch(e){if(/não foi aceita/.test(e.message))await fs.doc('config/segredos').set({docusealKey:''},{merge:true});throw e}}

/* ---------- o que o CRM chama ---------- */
const SCH={Gmail:{send_message:{type:'object',properties:{to:{type:'array'},subject:{type:'string'},body:{type:'string'},htmlBody:{type:'string'}}}}};
const MCP={
  async callTool(server,tool,input){let p;
    if(server==='DocuSeal')p=await ds(tool,input||{});
    else if(['Gmail','Google Calendar','Google Drive'].includes(server))p=await ponte(server,tool,input||{});

  async describeTool(server,tool){const s=SCH[server]&&SCH[server][tool];return {name:tool,inputSchema:s||null}},
  async listTools(){return []}};

let ST=null;try{ST=firebase.storage();ST.setMaxUploadRetryTime(20000);ST.setMaxOperationRetryTime(20000)}catch(e){}
const ASSETS=ST&&{
  async upload(blob){const id=Date.now().toString(36)+Math.random().toString(36).slice(2,8);const nome=(blob.name||'arquivo').replace(/[^\w.\-]+/g,'_');const ref=ST.ref('anexos/'+id+'-'+nome);

/* só uma tela aberta faz os envios automáticos de cada vez (evita e-mail em dobro) */
const SID=Math.random().toString(36).slice(2);window.__autoLider=false;
async function liderar(){try{const ref=fs.doc('config/automacao');const ok=await fs.runTransaction(async tx=>{const d=await tx.get(ref);const x=d.exists?d.data():{};const vivo=x.ts&&Date.now()-x.ts<12*60*1000;

/* aviso de versão nova publicada no GitHub */
async function novaVersao(){try{const r=await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'});const t=await r.text();const m=t.match(/window\.CRM_BUILD='(\d+)'/);

async function save(col,rec){

  if(col==='lancamentos'&&!rec.usuario){const u=usuarioAtual();if(u)rec={...rec,usuario:u}}
  if(col==='oportunidades'){const old=rec.id&&S.data.oportunidades.find(x=>x.id===rec.id);if((old&&old.etapa!==rec.etapa)||(!old&&rec.etapa))rec={...rec,historico:[...((old&&old.historico)||rec.historico||[]),{em:new Date().toISOString(),etapa:rec.etapa,de:old?old.etapa:'',usuario:usuarioAtual(),venc:rec.proximaAcao||''}]}}

  if(S.mode==='db'){await S.db.collection(col).doc(id).delete();return}
  S.data[col]=S.data[col].filter(x=>x.id!==id);persistLocal();schedule();
}
async function patch(col,id,changes){

  if(col==='oportunidades'&&changes.etapa&&changes.etapa!==r.etapa&&typeof oppEntrou==='function'){try{const pz=await oppEntrou(r,changes.etapa);if(pz)changes={...changes,prazoEtapa:pz}}catch(e){}}

function failWrite(e){toast(e&&e.code==='invalid_argument'?'O banco recusou este registro (sem permissão ou grande demais).':e&&e.code==='quota_exceeded'?'O banco de dados está cheio. Exclua registros antigos para continuar.':'Não foi possível salvar. Tente de novo em instantes.',true)}

S.imp=null;S.impDone=true;S.importing=false;
async function checkImport(){
  if(S.mode!=='db')return;
  try{const r=await fetch('import/manifest.json',{cache:'no-store'});if(!r.ok)return;const m=await r.json();
    const st=await S.db.doc('config/importacao').get();S.imp=m;S.impDone=!!(st.exists&&st.data().versao===m.versao);schedule()}catch(e){}
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function writeWithRetry(col,rec){
  const {id,...body}=rec;let wait=400;
  for(let a=0;a<8;a++){try{await S.db.collection(col).doc(id).set(body);return}catch(e){if(e&&(e.code==='invalid_argument'||e.code==='quota_exceeded'||e.code==='revoked'))throw e;await sleep(wait+Math.random()*300);wait=Math.min(wait*2,8000)}}
  throw {code:'unavailable'};
}
async function runImport(){
  if(S.importing||!S.imp)return;S.importing=true;
  const box=$('#impBox');const total=Object.values(S.imp.arquivos).reduce((a,b)=>a+b,0);let done=0;
  const upd=(t)=>{if(box)box.innerHTML=`<div style="display:grid;gap:8px;width:100%"><b>Importando do Alboom… ${t||''}</b><div class="track" style="height:10px;--c:var(--accent)"><i style="width:${Math.round(done/total*100)}%"></i></div><span class="muted num">${done} de ${total} registros · não feche esta página</span></div>`};
  upd();
  try{
    for(const col of Object.keys(S.imp.arquivos)){
      upd(SCHEMAS[col].label.toLowerCase());
      const recs=await (await fetch('import/'+col+'.json',{cache:'no-store'})).json();
      let i=0;const worker=async()=>{while(i<recs.length){const r=recs[i++];await writeWithRetry(col,r);done++;if(done%10===0)upd(SCHEMAS[col].label.toLowerCase())}};
      await Promise.all([worker(),worker(),worker(),worker(),worker()]);
    }
    await S.db.doc('config/importacao').set({versao:S.imp.versao,em:new Date().toISOString(),registros:total});
    S.impDone=true;toast('Importação concluída: '+total+' registros');
  }catch(e){failWrite(e);toast('A importação parou em '+done+' de '+total+'. Clique em Importar de novo para continuar — o que já entrou não duplica.',true)}
  S.importing=false;render();
}

S.sync=null;S.syncDone=true;S.syncing=false;
async function checkSync(){
  if(S.mode!=='db')return;

    const st=await S.db.doc('config/sincronizacao').get();S.sync=m;S.syncDone=!!(st.exists&&st.data().versao===m.versao);schedule()}catch(e){}
}
async function updWithRetry(col,id,data){let wait=400;for(let a=0;a<8;a++){try{await S.db.collection(col).doc(id).update(data);return}catch(e){if(e&&(e.code==='invalid_argument'||e.code==='quota_exceeded'||e.code==='revoked'||e.code==='not_found'))throw e;await sleep(wait+Math.random()*300);wait=Math.min(wait*2,8000)}}throw {code:'unavailable'}}
async function runSync(){
  if(S.syncing||!S.sync)return;S.syncing=true;
  const m=S.sync,box=$('#syncBox');const total=m.patches+m.buckets+(+m.contratosN||0)+(+m.historicoN||0);let done=0;
  const upd=t=>{if(box)box.innerHTML=`<div style="display:grid;gap:8px;width:100%"><b>Atualizando com o Alboom… ${t||''}</b><div class="track" style="height:10px;--c:var(--accent)"><i style="width:${Math.round(done/total*100)}%"></i></div><span class="muted num">${done} de ${total} · não feche esta página</span></div>`};
  upd();
  try{
    const P=await (await fetch('sync/'+(m.patchFile||'patches.json'),{cache:'no-store'})).json();
    const byNum={};S.data.contatos.forEach(c=>{if(c.num!=null&&!byNum[c.num])byNum[c.num]=c.id});const byOpp={};S.data.oportunidades.forEach(o=>{if(o.num!=null&&!byOpp[o.num])byOpp[o.num]=o.id});
    const has=(col,id)=>S.data[col].some(r=>r.id===id);
    const one=async p=>{
      if(p.ifAbsentNum&&byNum[p.ifAbsentNum]&&byNum[p.ifAbsentNum]!==p.id)return;
      const id=p.id||byNum[p.num];if(!id)return;const data={...p.data};
      if(p.contatoNum&&byNum[p.contatoNum])data.contatoId=byNum[p.contatoNum];
      if(p.oppNum&&byOpp[p.oppNum])data.oportunidadeId=byOpp[p.oppNum];
      if(p.op==='update'){if(!has(p.col,id))return;try{await updWithRetry(p.col,id,data)}catch(e){if(e&&e.code==='not_found')return;throw e}}
      else{if(has(p.col,id))return;await writeWithRetry(p.col,{...data,id});if(p.col==='contatos'&&data.num!=null)byNum[data.num]=id}
    };
    const first=P.filter(p=>p.col==='contatos'),rest=P.filter(p=>p.col!=='contatos');
    for(const p of first){await one(p);done++}
    upd('pedidos e oportunidades');
    let i=0;const worker=async()=>{while(i<rest.length){const p=rest[i++];await one(p);done++;if(done%20===0)upd('pedidos e oportunidades')}};
    await Promise.all([worker(),worker(),worker(),worker(),worker()]);
    for(const f of m.fin){
      upd('financeiro');const blocks=await (await fetch('sync/'+f,{cache:'no-store'})).json();const keys=Object.keys(blocks);let j=0;
      const w=async()=>{while(j<keys.length){const k=keys[j++];const ex=S.finB&&S.finB[k];if(!(ex&&ex.length))await writeWithRetry('fin',{id:k,itens:blocks[k]});else if(m.mergeFin){const old=Object.fromEntries(ex.map(x=>[String(x.aid),x]));const inc=new Set(blocks[k].map(x=>String(x.aid)));const merged=[...blocks[k].map(n=>{const o=old[String(n.aid)];return o&&o.atualizadoEm?{...o,usuario:o.usuario||n.usuario}:n}),...ex.filter(o=>!inc.has(String(o.aid)))];await writeWithRetry('fin',{id:k,itens:merged})}done++;if(done%10===0)upd('financeiro')}};
      await Promise.all([w(),w(),w(),w()]);
    }
    if((m.contratos||[]).length){let feito=false;try{const x=await S.db.doc('config/contratosAlb').get();feito=x.exists&&x.data().n>=m.contratosN}catch(_){}
      if(!feito){const byN={};S.data.contatos.forEach(c=>{if(c.num!=null&&!byN[c.num])byN[c.num]=c.id});
        for(const f of m.contratos){upd('contratos');const L=await (await fetch('sync/'+f,{cache:'no-store'})).json();let j=0;
          const w=async()=>{while(j<L.length){const d=L[j++];if(d.contatoNum&&byN[d.contatoNum])d.contatoId=byN[d.contatoNum];await writeWithRetry('contratosAlb',d);done++;if(done%20===0)upd('contratos')}};
          await Promise.all([w(),w(),w(),w()])}
        await S.db.doc('config/contratosAlb').set({n:m.contratosN,em:new Date().toISOString()})}else done+=m.contratosN}
    if((m.historico||[]).length){let feito=false;try{const x=await S.db.doc('config/historicoAlb').get();feito=x.exists&&x.data().n>=m.historicoN}catch(_){}
      if(!feito){for(const f of m.historico){upd('histórico');const L=await (await fetch('sync/'+f,{cache:'no-store'})).json();let j=0;
          const w=async()=>{while(j<L.length){const d=L[j++];try{await writeWithRetry('historicoAlb',d)}catch(e){if(e&&e.code==='invalid_argument'){S.histPulos=(S.histPulos||0)+1}else throw e}done++;if(done%20===0)upd('histórico')}};await Promise.all([w(),w(),w(),w()])}
        await S.db.doc('config/historicoAlb').set({n:m.historicoN,em:new Date().toISOString()})}else done+=m.historicoN}
    await S.db.doc('config/sincronizacao').set({versao:m.versao,em:new Date().toISOString()});
    S.syncDone=true;toast('Atualização concluída: dados e financeiro do Alboom no CRM');
  }catch(e){failWrite(e);toast('A atualização parou em '+done+' de '+total+'. Clique em Atualizar de novo para continuar — o que já entrou não duplica.',true)}
  S.syncing=false;render();
}

function navKids(kids,link,isOn){let h='',i=0;const tog=(k,open)=>`<button class="navtog" data-navtog="${k.key}" aria-expanded="${open}" title="${open?'Recolher':'Mostrar'} ${esc(k.sg)}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>`;
  while(i<kids.length){const k=kids[i];if(!k.sg){h+=link(k,k.cnt?k.cnt():0);i++;continue}

function ctRefs(id){let n=0;const D=S.data;['pedidos','oportunidades','agenda','projetos','provas','propostas','anexos','tarefas'].forEach(col=>(D[col]||[]).forEach(r=>{if(r.contatoId===id||r.contato2Id===id||(col==='provas'&&(r.clientes||[]).some(c=>c.c===id)))n+=col==='pedidos'?10:1}));D.lancamentos.forEach(l=>{if(l.contatoId===id)n++});return n}
function dupGroups(){
  const key=S.data.contatos.length+':'+(S.data.contatos[0]&&S.data.contatos[0].atualizadoEm)+':'+((cfg().dupIgnorar||[]).length);if(dupGroups.k===key)return dupGroups.v;
  const L=S.data.contatos,par={},find=x=>par[x]===x?x:(par[x]=find(par[x])),uni=(a,b)=>{par[find(a)]=find(b)};L.forEach(c=>par[c.id]=c.id);
  const why={},idx={};const ign=new Set(cfg().dupIgnorar||[]);
  const add=(k,c,tipo)=>{if(!k)return;const o=idx[k];if(o&&o!==c.id){if(ign.has([o,c.id].sort().join('|')))return;uni(o,c.id);(why[o+'|'+c.id]=why[o+'|'+c.id]||[]).push(tipo)}else idx[k]=c.id};
  L.forEach(c=>{const d=onlyD(c.cpf);if(d.length===11)add('d:'+d,c,'CPF');else if(d.length>=12)add('d:'+d,c,'CNPJ');const e=String(c.email||'').trim().toLowerCase();if(/@/.test(e))add('e:'+e,c,'e-mail');const n=normTxt(SCHEMAS.contatos.labelOf(c)).replace(/\s+/g,' ').trim();const f=onlyD(c.celular||c.fone).slice(-8);if(n.length>5&&f.length===8)add('nf:'+n+f,c,'nome e telefone')});
  const G={};L.forEach(c=>{const r=find(c.id);(G[r]=G[r]||[]).push(c)});
  const out=Object.values(G).filter(g=>g.length>1).map(g=>{const ids=new Set(g.map(c=>c.id));const tipos=[...new Set(Object.entries(why).filter(([k])=>k.split('|').every(x=>ids.has(x))).flatMap(([,v])=>v))];
    const ord=g.map(c=>({c,refs:ctRefs(c.id)})).sort((a,b)=>b.refs-a.refs||((a.c.num??1e9)-(b.c.num??1e9)));return {membros:ord,tipos,forte:tipos.some(t=>t==='CPF'||t==='e-mail'||t==='nome e telefone')}}).sort((a,b)=>b.forte-a.forte);
  dupGroups.k=key;dupGroups.v=out;return out}
async function mesclarContatos(keepId,dupIds){
  const keep=S.data.contatos.find(c=>c.id===keepId);if(!keep)return;const novo={...keep};const notas=[...(keep.notasLista||[])];const alt=new Set(keep.numsAlt||[]);const obs=[];
  for(const did of dupIds){const d=S.data.contatos.find(c=>c.id===did);if(!d)continue;
    for(const [k,v] of Object.entries(d)){if(['id','num','criadoEm','atualizadoEm','numsAlt','notasLista','importadoEm','origemId'].includes(k))continue;if(v===''||v==null||v===false)continue;if(novo[k]===''||novo[k]==null)novo[k]=v}
    if(d.email&&keep.email&&d.email.toLowerCase()!==String(keep.email).toLowerCase()&&!novo.email2)novo.email2=d.email;
    if(d.celular&&onlyD(d.celular).slice(-8)!==onlyD(novo.celular).slice(-8)&&!novo.fone)novo.fone=d.celular;
    if(d.tags)novo.tags=[...new Set([...(novo.tags||'').split(','),...d.tags.split(',')].map(t=>t.trim()).filter(Boolean))].join(', ');
    (d.notasLista||[]).forEach(n=>notas.push(n));if(d.num!=null)alt.add(d.num);(d.numsAlt||[]).forEach(n=>alt.add(n));obs.push('#'+(d.num??'')+' '+SCHEMAS.contatos.labelOf(d))}
  novo.notasLista=[...notas,{t:'Contato mesclado com: '+obs.join(', '),em:new Date().toISOString()}];if(alt.size)novo.numsAlt=[...alt];if(novo.categoria==='Proposta'&&dupIds.some(i=>(S.data.contatos.find(c=>c.id===i)||{}).categoria==='Cliente'))novo.categoria='Cliente';
  await save('contatos',novo);
  const D=S.data,dup=new Set(dupIds);
  for(const col of ['pedidos','oportunidades','agenda','projetos','provas','propostas','anexos','tarefas','fichas']){for(const r of [...(D[col]||[])]){const ch={};if(dup.has(r.contatoId))ch.contatoId=keepId;if(dup.has(r.contato2Id))ch.contato2Id=keepId;if(col==='provas'&&(r.clientes||[]).some(c=>dup.has(c.c)))ch.clientes=r.clientes.map(c=>dup.has(c.c)?{...c,c:keepId}:c);if(Object.keys(ch).length)await patch(col,r.id,ch)}}
  for(const l of [...D.lancamentos])if(dup.has(l.contatoId)&&!String(l.id).startsWith('f~'))await patch('lancamentos',l.id,{contatoId:keepId});
  for(const did of dupIds)await removeRec('contatos',did);
  rebuildLanc();
}

async function uploadToProva(id,files,section){
  if(S.up){toast('Aguarde o envio atual terminar.',true);return}
  const A=await getAssets();
  if(!A){toast('O envio de imagens só funciona no CRM publicado, para quem pode editar.',true);return}
  const all=[...files];const xmps={};
  for(const f of all)if(/\.xmp$/i.test(f.name))xmps[f.name.replace(/\.xmp$/i,'').toLowerCase()]=await f.text();
  let imgs=all.filter(f=>/\.(jpe?g|png|gif|webp)$/i.test(f.name)).sort((a,b)=>natCmp(a.name,b.name));
  if(section==='capa'||section==='contracapa')imgs=imgs.slice(0,1);
  if(!imgs.length){toast('Nenhuma imagem JPG, PNG ou GIF encontrada nos arquivos.',true);return}
  const p0=S.data.provas.find(x=>x.id===id);const album=p0.tipo==='Álbum';
  const existing=section==='imgs'?(p0.imgs||[]):section==='paginas'?(p0.paginas||[]):[];
  if(existing.length+imgs.length>2200){toast('Limite de 2.200 imagens por prova. Divida em duas provas.',true);return}
  const PC=cfg().provas;const max=album?2600:1800;const box=!album&&PC.redim?{w:+PC.maxW||1500,h:+PC.maxH||1000}:null;
  let wm=null;if(p0.marcaDagua&&PC.marca&&PC.marca.a){try{const b=await (await fetch(blobUrl(PC.marca.a))).blob();wm={bmp:await createImageBitmap(b),pos:+PC.marca.pos||8,margem:PC.marca.margem}}catch(e){}}
  S.up={id,total:imgs.length,done:0,err:[],section};upProg();
  const got=[];let i=0,lastFlush=0,writing=Promise.resolve();
  const flush=(final)=>{writing=writing.then(async()=>{const p=S.data.provas.find(x=>x.id===id)||p0;const merged=[...existing,...got].sort((a,b)=>natCmp(a.n,b.n));
    const ch={};if(section==='imgs')ch.imgs=merged;else if(section==='paginas')ch.paginas=merged;else ch[section]=got[0]||p[section];
    if(final){ch.atividade=logAct(p,`${got.length} arquivos foram enviados, ${section==='imgs'?merged.length:pvImgs({...p,...ch}).length} arquivos totais`);if(!p.capaImg&&got[0])ch.capaImg=(section==='paginas'&&p.capa)?p.capa.a:got[0].a;ch.imagens=pvImgs({...p,...ch}).length}
    await pvSave(id,ch)})};
  const worker=async()=>{while(i<imgs.length){const f=imgs[i++];
    try{const base=f.name.replace(/\.[^.]+$/,'').toLowerCase();let lb=xmps[base]?labelFromXmpText(xmps[base]):await labelFromJpeg(f);
      const r0=await resizeImage(f,max,box,wm);let r,wait=800;
      for(let a=0;a<5;a++){try{r=await A.upload(r0.blob,{type:'image/jpeg'});break}catch(e){if(e&&(e.code==='rate_limited'||e.code==='store_unavailable')&&a<4){await sleep(wait);wait*=2}else throw e}}
      const o={a:r.id,n:f.name,s:r.sizeBytes,w:r0.w,h:r0.h};if(cfg().provas.usarLR!==false){if(lb.k)o.l=lb.k;else if(lb.raw)o.lr=lb.raw;if(lb.r>0)o.r=lb.r}got.push(o);
    }catch(e){S.up.err.push(f.name+(e&&e.code==='quota_or_state'?' (espaço de armazenamento cheio)':e&&e.code==='too_large'?' (arquivo grande demais)':''));if(e&&e.code==='quota_or_state'){i=imgs.length}}
    S.up.done++;upProg();if(got.length-lastFlush>=25){lastFlush=got.length;flush(false)}}};
  await Promise.all([worker(),worker(),worker()]);flush(true);await writing;
  const errs=S.up.err;S.up=null;render();
  toast(errs.length?`${got.length} enviadas, ${errs.length} com erro: ${errs.slice(0,3).join(', ')}${errs.length>3?'…':''}`:`${got.length} imagens enviadas`,!!errs.length);
}

// flipbook
function wireAlbum(){
  const root=$('#album');if(!root)return;const p=S.data.provas.find(x=>x.id===S.ui.pv.id);const pages=pvImgs(p);const A=S.ui.alb;
  if(A.pid!==p.id){A.pid=p.id;A.i=0;A.grid=false}
  A.i=Math.min(A.i,pages.length-1);let busy=false;
  root.innerHTML=`<div class="bk-stage" id="bkStage"></div><div class="bk-ctrl"><span class="num"><b id="bkNum">${A.i+1}</b> / ${pages.length}</span><div class="mid"><button class="icon-btn" id="bkGrid" title="Miniaturas">${ic('grid',15)}</button><button class="icon-btn" id="bkFull" title="Tela cheia">${ic('full',15)}</button><button class="icon-btn" data-pvinfo title="Instruções">${ic('info',15)}</button></div><span class="muted" style="font-size:12px">${esc(p.paginasModo||'Simples')}</span></div>`;
  const stage=$('#bkStage');
  const isWide=pg=>(pg.w||1)/(pg.h||1)>1.45;
  const SP=[];{let k=0;const endIdx=p.contracapa?pages.length-1:pages.length;
    if(p.capa&&!isWide(pages[0])){SP.push([null,0]);k=1}
    while(k<endIdx){if(isWide(pages[k])){SP.push([k]);k++;continue}if(k+1<endIdx&&!isWide(pages[k+1])){SP.push([k,k+1]);k+=2}else{SP.push([k,null]);k++}}
    if(p.contracapa&&pages.length>1)SP.push(isWide(pages[pages.length-1])?[pages.length-1]:[pages.length-1,null]);}
  let si=Math.max(0,SP.findIndex(sp=>sp.includes(A.i)));
  const first=sp=>sp.find(x=>x!=null);
  const ar=sp=>{const pg=pages[first(sp)];const r=(pg.w||2)/(pg.h||1);return sp.length===1?r:2*r};
  const fit=sp=>{const r=stage.getBoundingClientRect();const W=r.width-120,H=r.height-40;const a=ar(sp);let w=W,h=W/a;if(h>H){h=H;w=H*a}return{w:Math.max(120,Math.round(w)),h:Math.max(80,Math.round(h))}};
  const im=i=>i==null?'':`<img src="${blobUrl(pages[i].a)}" alt="Página ${i+1}" draggable="false">`;
  const sheet=(sp,d,extra='')=>sp.length===1?`<div class="bk-box bk-sheet wide" style="width:${d.w}px;height:${d.h}px"><div class="bk-pg W">${im(sp[0])}</div>${extra}</div>`
    :`<div class="bk-box bk-sheet" style="width:${d.w}px;height:${d.h}px"><div class="bk-pg L ${sp[0]==null?'vazio':''}">${im(sp[0])}</div><div class="bk-pg R ${sp[1]==null?'vazio':''}">${im(sp[1])}</div><span class="bk-fold"></span>${extra}</div>`;
  const label=sp=>sp.filter(x=>x!=null).map(x=>x+1).join('–');
  const nav=()=>`${si>0?`<button class="navbtn l" id="bkPrev" aria-label="Página anterior">${ic('left',22)}</button>`:''}${si<SP.length-1?`<button class="navbtn r" id="bkNext" aria-label="Próxima página">${ic('right',22)}</button>`:''}`;
  const draw=()=>{const sp=SP[si];A.i=first(sp);$('#bkNum').textContent=label(sp);
    if(A.grid){stage.innerHTML=`<div class="bk-thumbs" style="position:absolute;inset:0">${pages.map((pg,k)=>`<button class="${SP[si].includes(k)?'on':''}" data-bkgo="${k}"><img loading="lazy" src="${blobUrl(pg.a)}" alt=""><span>${k===0&&p.capa?'Capa':k===pages.length-1&&p.contracapa?'Contracapa':'Página '+(k+1)}</span></button>`).join('')}</div>`;return}
    stage.innerHTML=sheet(sp,fit(sp))+nav();
    [SP[si+1],SP[si-1]].forEach(x=>{if(x)x.forEach(i=>{if(i!=null){const m=new Image();m.src=blobUrl(pages[i].a)}})});
    $('#bkPrev')&&($('#bkPrev').onclick=()=>go2(-1));$('#bkNext')&&($('#bkNext').onclick=()=>go2(1));};
  const go2=dir=>{if(busy)return;const j=si+dir;if(j<0||j>=SP.length)return;const cur=SP[si],nx=SP[j];
    const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduce||cur.length===1||nx.length===1){si=j;draw();return}
    busy=true;const d=fit(cur),fwd=dir>0;
    const base=fwd?[cur[0],nx[1]]:[nx[0],cur[1]];
    const leaf=`<div class="bk-leaf ${fwd?'nx':'pv'}" id="bkLeaf"><div class="f front ${(fwd?cur[1]:cur[0])==null?'vazio':''}">${im(fwd?cur[1]:cur[0])}</div><div class="f back ${(fwd?nx[0]:nx[1])==null?'vazio':''}">${im(fwd?nx[0]:nx[1])}</div></div>`;
    stage.innerHTML=sheet(base,d,leaf);
    const lf=$('#bkLeaf');requestAnimationFrame(()=>requestAnimationFrame(()=>{lf.style.transform=`rotateY(${fwd?-180:180}deg)`}));
    const end=()=>{if(!busy)return;busy=false;si=j;draw()};lf.addEventListener('transitionend',end,{once:true});setTimeout(end,1100);
  };
  stage.addEventListener('keydown',()=>{});
  if(!wireAlbum.kb){wireAlbum.kb=true;document.addEventListener('keydown',e=>{const r=$('#album');if(!r||!r._go||S.ui.view!=='provaview')return;if(e.key==='ArrowRight')r._go(1);if(e.key==='ArrowLeft')r._go(-1)})}
  {let sx=null;stage.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});stage.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>40)go2(dx<0?1:-1)})}
  stage.onclick=e=>{const b=e.target.closest('[data-bkgo]');if(b){const k=+b.dataset.bkgo;si=Math.max(0,SP.findIndex(sp=>sp.includes(k)));A.grid=false;draw()}};
  $('#bkGrid').onclick=()=>{A.grid=!A.grid;draw()};
  $('#bkFull').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():root.requestFullscreen().catch(()=>toast('Tela cheia não disponível aqui.'))}catch(e){toast('Tela cheia não disponível aqui.')}};
  root._go=go2;draw();
  if(!wireAlbum.rs){wireAlbum.rs=true;addEventListener('resize',()=>{if(S.ui.view==='provaview'&&$('#album')&&!S.ui.alb.grid)wireAlbum()});document.addEventListener('fullscreenchange',()=>{if($('#album'))setTimeout(wireAlbum,60)})}
}

function calItems(from,to){

  if(C.src.eventos)agendaAll().forEach(e=>{if(inR(e.data)&&C.tipos[e.tipo]!==false&&(!C.resp||(e.participantes||[]).includes(C.resp)||(e._ped?e.responsavel===C.resp:(e.responsavel||'')===C.resp||!e.responsavel)))out.push({d:e.data,h:e.hora||'',t:e.titulo,c:TIPOS[e.tipo]||'--idle',col:e._ped?'pedidos':'agenda',id:e.id})});

S.ui.rel={regime:'competencia',periodo:'ultimo',de:'',ate:''};
function relRange(){
  const R=S.ui.rel,n=new Date(),y=n.getFullYear(),m=n.getMonth();
  const r=(a,b)=>[iso(a),iso(b)];
  switch(R.periodo){
    case 'mes':return r(new Date(y,m,1),new Date(y,m+1,0));
    case 'ultimo':return r(new Date(y,m-1,1),new Date(y,m,0));
    case 'tri':return r(new Date(y,m-2,1),new Date(y,m+1,0));
    case 'ano':return r(new Date(y,0,1),new Date(y,11,31));
    case 'anoant':return r(new Date(y-1,0,1),new Date(y-1,11,31));
    case 'u12':return r(new Date(y,m-11,1),new Date(y,m+1,0));
    case 'tudo':return ['2000-01-01','2099-12-31'];
    default:return [R.de||iso(new Date(y,m,1)),R.ate||iso(new Date(y,m+1,0))];
  }
}
const PER={mes:'Este mês',ultimo:'Último mês',tri:'Últimos 3 meses',ano:'Este ano',anoant:'Ano passado',u12:'Últimos 12 meses',tudo:'Todo o período',custom:'Personalizado'};
VIEWS.relatorios=()=>{

  const pendD=caixa?0:pend.filter(l=>l.tipo==='pagar').reduce((a,l)=>a+(+l.valor||0),0);
  const rows=(list,tot,cls)=>list.length?list.map(([k,v])=>`<tr class="row"><td style="padding-left:28px">${esc(k)}</td><td class="r"><span class="num ${cls}">${brl(v)}</span></td><td class="r"><span class="num muted">${tot?Math.round(v/tot*1000)/10:0}%</span></td></tr>`).join(''):`<tr><td colspan="3" class="muted" style="padding-left:28px">Nenhum lançamento no período</td></tr>`;
  // monthly series: 6 months ending at 'ate'
  const end=parseD(ate),months=[];for(let i=5;i>=0;i--){const d=new Date(end.getFullYear(),end.getMonth()-i,1);months.push(d.getFullYear()+'-'+pad(d.getMonth()+1))}

  const mx=Math.max(1,...ser.map(x=>Math.max(x.r,x.d)));const nice=(v=>{const e=Math.pow(10,Math.floor(Math.log10(v)));const f=v/e;return (f<=1?1:f<=2?2:f<=5?5:10)*e})(mx);

  // vendas (pedidos) no período
  const peds=S.data.pedidos.filter(p=>p.contratoStatus!=='Cancelado'&&inR(p.dataEvento));
  const vm={};peds.forEach(p=>{const k=p.categoria||(p.itens||[]).map(i=>nameOf('produtos',i.produtoId)||i.desc).filter(Boolean)[0]||'Outros';(vm[k]=vm[k]||{n:0,v:0});vm[k].n++;vm[k].v+=pedidoTotal(p)});
  const vt=peds.reduce((a,p)=>a+pedidoTotal(p),0);const vl=Object.entries(vm).sort((a,b)=>b[1].v-a[1].v);
  const canc=S.data.pedidos.filter(p=>p.contratoStatus==='Cancelado'&&inR(p.dataEvento)).length;
  const kp=(v,l,c)=>`<div class="panel kpi"><div class="body"><div class="v num" style="font-size:22px;${c?'color:var('+c+')':''}">${v}</div><div class="l">${l}</div></div></div>`;

       <div class="seg">${Object.entries(PER).map(([k,l])=>`<button data-per="${k}" class="${R.periodo===k?'on':''}">${l}</button>`).join('')}</div>

     </div>

   </div></section>

VIEWS.relvendas=()=>{

function contaCalc(){const t=today(),m={},sem={};const B=bancos(),byN={},byC={};B.forEach(b=>{byN[b.nome]=b;if(b.codigo)byC[b.codigo]=b;m[b.id]={n:0,hoje:0,tudo:0,ref:0,conc:0,de:'9',ate:'0'}});
  movPagos().forEach(l=>{const b=bancoDe(l,byN,byC);const d=l.dataPagamento||l.vencimento||'';const v=(l.tipo==='pagar'?-1:1)*(+l.valor||0);
    if(!b){if(l.contaCod){const a=sem[l.contaCod]||(sem[l.contaCod]={n:0,de:'9',ate:'0',tipos:{}});a.n++;if(d<a.de)a.de=d;if(d>a.ate)a.ate=d;a.tipos[l.forma||'—']=(a.tipos[l.forma||'—']||0)+1}return}
    const a=m[b.id];a.n++;a.tudo+=v;if(l.conciliado)a.conc+=v;if(d<=t)a.hoje+=v;if(b.ref&&d<=b.ref.data)a.ref+=v;if(d&&d<a.de)a.de=d;if(d&&d>a.ate)a.ate=d});
  B.forEach(b=>{const a=m[b.id];a.aj=b.ref?(+b.ref.valor||0)-a.ref:(+b.ajuste||0);a.saldoHoje=a.hoje+a.aj;a.saldo=a.tudo+a.aj});
  m._sem=sem;return m}

const nrm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
function fluxoOf(p){const fs=fluxos();return fs.find(f=>nrm(f.nome)===nrm(p.fluxo))||fs.find(f=>nrm(f.nome)===nrm(p.tipo))||null}
function etapaIdx(f,p){return f?f.etapas.findIndex(e=>nrm(e.nome)===nrm(p.etapa)):-1}
async function tarefasDaEtapa(p,et,base){const ts=String(et.tarefas||'').split('\n').map(x=>x.trim()).filter(Boolean);const prazo=addDays(base,+et.dias||0);for(const t of ts)await save('tarefas',{titulo:t,projetoId:p.id,data:prazo,responsavel:p.responsavel||'',feita:false});return prazo}
async function pjAvancar(id,dir){const p=S.data.projetos.find(x=>x.id===id);const f=fluxoOf(p);if(!f){toast('Escolha o fluxo de trabalho do projeto primeiro.',true);return}
  const i=etapaIdx(f,p),j=Math.max(0,Math.min(f.etapas.length-1,i+(dir||1)));if(i===j&&i>=0)return;const et=f.etapas[j];const t=today();
  const prazo=dir<0?addDays(t,+et.dias||0):await tarefasDaEtapa(p,et,t);
  const fim=j===f.etapas.length-1;const hist=[...(p.historico||[]),{etapa:et.nome,em:new Date().toISOString()}].slice(-100);
  await patch('projetos',id,{fluxo:f.nome,etapa:et.nome,prazoEtapa:prazo,historico:hist,...(fim?{status:'Concluído'}:p.status==='Não iniciado'?{status:'Em andamento'}:{})});toast('Etapa: '+et.nome)}
function projecao(p){const f=fluxoOf(p);if(!f)return [];const base=p.dataEvento||(p.criadoEm||'').slice(0,10)||today();let d=base;return f.etapas.map(e=>{d=addDays(d,+e.dias||0);return {nome:e.nome,dias:e.dias,prazo:d}})}

async function oppEntrou(o,etapa){const e=(cfg().funil||{})[etapa];if(!e)return;const ts=String(e.tarefas||'').split('\n').map(x=>x.trim()).filter(Boolean);const prazo=addDays(today(),+e.dias||0);for(const t of ts)await save('tarefas',{titulo:t+' · '+o.titulo,data:prazo,feita:false,oportunidadeId:o.id});return prazo}

function relRows(list,col,fmt){return list.length?`<div class="list-rows">${list.map(r=>`<div class="lr" style="grid-template-columns:86px minmax(0,1fr) auto"><span class="num muted">${fmt.d(r)}</span><button type="button" class="t" data-edit="${col}" data-id="${r.id}">${esc(SCHEMAS[col].labelOf(r))}</button><span>${fmt.r(r)}</span></div>`).join('')}</div>`:`<span class="muted" style="font-size:13px">Nenhum.</span>`}
const byDate=k=>(a,b)=>(b[k]||'').localeCompare(a[k]||'');
function clientStats(){
  const key=S.data.pedidos.length+':'+S.data.projetos.length+':'+S.data.oportunidades.length+':'+(S.data.pedidos[0]&&S.data.pedidos[0].atualizadoEm);
  if(clientStats.k===key)return clientStats.v;
  const m={};const g=id=>m[id]||(m[id]={ped:0,tot:0,ult:'',proj:0,opp:0});
  S.data.pedidos.forEach(p=>{if(!p.contatoId||p.contratoStatus==='Cancelado')return;const x=g(p.contatoId);x.ped++;x.tot+=pedidoTotal(p);if((p.dataEvento||'')>x.ult)x.ult=p.dataEvento});
  S.data.projetos.forEach(p=>{if(p.contatoId)g(p.contatoId).proj++});
  S.data.oportunidades.forEach(o=>{if(o.contatoId)g(o.contatoId).opp++});
  clientStats.k=key;clientStats.v=m;return m;
}

   ${fin.length?`<div class="field"><label>Financeiro</label>${relRows(fin,'lancamentos',{d:r=>fdate(r.vencimento),r:r=>`<span class="num ${r.tipo==='pagar'?'money-out':'money-in'}">${brl(r.valor)}</span> ${r.pago?badge('Pago','--ok'):badge('Em aberto','--warn')}`})}</div>`:''}
   ${(()=>{const c=S.data.contatos.find(x=>x.id===cid);return c&&c.num!=null?`<div class="field"><label>Contratos gerados no Alboom</label><div data-ctalbc="${c.num}" class="muted" style="font-size:13px">carregando…</div></div><div class="field"><label>Linha do tempo e anotações (Alboom)</label><div data-histalb="${c.num}" class="muted" style="font-size:13px">carregando…</div></div>`:''})()}

function openForm(col,rec={}){

  const tabs=sc.tabs&&col==='contatos'&&rec.id?[...sc.tabs,'Histórico']:sc.tabs;
  const bodyFor=ti=>`<div class="fgrid" data-tabpane="${ti}" ${tabs&&ti!==0?'hidden':''}>${sc.fields.filter(f=>(f.tab||0)===ti).map(f=>fieldHTML(f,rec)).join('')}</div>`;
  let panes=tabs?sc.tabs.map((_,i)=>bodyFor(i)).join(''):bodyFor(0);
  if(tabs&&tabs.length>sc.tabs.length)panes+=`<div data-tabpane="${sc.tabs.length}" hidden>${historicoHTML(rec.id)}</div>`;
  if(col==='pedidos'&&rec.id)panes+=`<div class="fgrid">${vinculosPedido(rec)}</div>`;
  if(col==='agenda')panes+=opBarra(rec);
  const title=col==='lancamentos'?((isNew?'Adicionar':'Editar')+' · '+(rec.tipo==='pagar'?'A pagar':rec.tipo==='receber'?'A receber':'lançamento')):(isNew?`Nov${sc.gender} ${sc.one}`:`Editar ${sc.one}`);
  $('#modalRoot').innerHTML=`<div class="overlay" data-close-bg><form class="modal" id="mform" novalidate>
    <header><h3>${title}</h3>${rec.num?`<span class="num muted">#${rec.num}</span>`:''}${rec.exemplo?badge('exemplo','--warn'):''}<button type="button" class="icon-btn x" data-close aria-label="Fechar">${ic('x',15)}</button></header>
    <div class="mbody">${tabs?`<div class="tabs">${tabs.map((t,i)=>`<button type="button" data-tab="${i}" class="${i===0?'on':''}">${t}</button>`).join('')}</div>`:''}${panes}<div class="err" id="formErr" style="color:var(--danger);font-size:13px" hidden></div></div>
    <footer>${!isNew?`<button type="button" class="btn danger" data-mdel>${ic('trash',15)} Excluir</button>`:''}${col==='pedidos'&&!isNew?`<button type="button" class="btn" data-contract="${rec.id}">${ic('doc',15)} Contrato</button><button type="button" class="btn" style="background:var(--info);border-color:var(--info);color:#fff" data-sign="${rec.id}">${ic('edit',15)} Assinatura digital</button>`:''}<span class="sp"></span><button type="button" class="btn" data-close>Cancelar</button><button type="submit" class="btn pri">Salvar</button></footer>
  </form></div>`;
  updItemsTotal();pedFormSync();
  const firstInput=$('#mform .fgrid input:not([type=checkbox]), #mform .fgrid select');
  if(firstInput&&innerWidth>700)setTimeout(()=>firstInput.focus(),30);
}

async function submitForm(){
  const {col,rec}=M;const sc=SCHEMAS[col];const out={...rec};const missing=[];
  sc.fields.forEach(f=>{
    if(f.newOnly&&rec.id&&!(typeof f.newOnly==='function'&&f.newOnly(rec)))return;if(f.hide&&f.hide(rec||{}))return;
    if(f.t==='items'){out[f.k]=readItems();return}
    if(f.t==='custos')return;
    const el=document.getElementById('f-'+f.k);if(!el)return;
    if(f.t==='pessoas'||f.t==='multi'){out[f.k]=[...el.querySelectorAll('input:checked')].map(i=>i.value);return}
    let v=f.t==='check'?el.checked:el.value;
    if(f.t==='money')v=String(v).trim()===''?'':moneyParse(v);else if(f.t==='number')v=v===''?'':+v;
    if(typeof v==='string')v=v.trim();
    if(f.t==='ref'&&el.tagName==='INPUT'){const r=refFromInput(v,f.ref);if(r===null){missing.push(f.l+' (escolha um nome da lista)');return}v=r}
    out[f.k]=v;
    if(f.req&&(v===''||v==null))missing.push(f.l);
  });
  if(missing.length){const e=$('#formErr');e.hidden=false;e.textContent='Preencha: '+missing.join(', ')+'.';return}
  if(col==='pedidos'){delete out._c1;if(out.status==='Pedido Concluído'&&!out.concluidoEm)out.concluidoEm=today()}
  if(col==='produtos'&&$('#custosEd')){out.custos=readCustos();if(out.custos.length)out.custo=Math.round(sumV(out.custos)*100)/100}
  if(col==='provas'&&out.pedidoId&&!out.contatoId){const pd=S.data.pedidos.find(x=>x.id===out.pedidoId);if(pd&&pd.contatoId)out.contatoId=pd.contatoId}
  if(col==='pedidos'&&!(rec.custos&&rec.custos.length)){const g=pedCustosGerar(out);if(g.length)out.custos=g}
  const gen=out.gerarParcelas,mkAg=false,tmod=out.tarefasModelo;delete out.gerarParcelas;delete out.criarAgenda;delete out.tarefasModelo;
  if(col==='lancamentos'&&out.pago&&!out.dataPagamento)out.dataPagamento=today();
  const rec_={on:col==='lancamentos'&&!rec.id&&out.recorrente,f:out.recFreq||'Mensal',n:Math.max(1,parseInt(out.recVezes)||1)};if(col==='lancamentos'){delete out.recorrente;delete out.recFreq;delete out.recVezes}
  if(rec_.on&&rec_.n>1){rec_.base=out.descricao;rec_.grp='rc'+Date.now().toString(36);out.descricao=rec_.base+' (1/'+rec_.n+')';out.recGrupo=rec_.grp}
  if(col==='lancamentos'&&out.categoria&&/^\d+(\.\d+)*\s-\s/.test(out.categoria))out.planoCod=out.categoria.split(' - ')[0];
  const btn=$('#mform button[type=submit]');btn.disabled=true;btn.textContent='Salvando…';
  try{
    const id=await save(col,out);
    if(rec_.on&&rec_.n>1&&out.vencimento){const grp=rec_.grp;for(let i=1;i<rec_.n;i++){const d=parseD(out.vencimento);if(rec_.f==='Mensal')d.setMonth(d.getMonth()+i);else if(rec_.f==='Anual')d.setFullYear(d.getFullYear()+i);else d.setDate(d.getDate()+i*(rec_.f==='Semanal'?7:15));await save('lancamentos',{...out,vencimento:iso(d),pago:false,dataPagamento:'',recGrupo:grp,descricao:rec_.base+' ('+(i+1)+'/'+rec_.n+')'})}toast(rec_.n+' lançamentos criados')}
    if(col==='pedidos'&&!rec.id){
      const total=pedidoTotal(out);const n=Math.max(1,parseInt(out.parcelas)||1);
      if(gen&&total>0){const base=Math.floor(total/n*100)/100;let first=out.primeiroVenc||today();
        for(let i=0;i<n;i++){const d=parseD(first);d.setMonth(d.getMonth()+i);const val=i===n-1?Math.round((total-base*(n-1))*100)/100:base;
          await save('lancamentos',{tipo:'receber',categoria:'Evento',descricao:`Parcela ${i+1}/${n} · ${out.titulo}`,contatoId:out.contatoId,valor:val,vencimento:iso(d),conta:out.contaDeposito||'',forma:out.pagamento||'',pago:false,pedidoId:id})}}
      if(mkAg&&out.dataEvento){const nomes=(out.itens||[]).map(i=>nameOf('produtos',i.produtoId)).filter(Boolean).join(' + ');
        await save('agenda',{titulo:(nomes?nomes+' · ':'')+out.titulo,tipo:'Locação (cabine/totem)',data:out.dataEvento,hora:out.horaEvento||'',local:out.local||'',contatoId:out.contatoId,pedidoId:id})}
      if(tmod){const m=cfg().pedTarefas.find(t=>t.nome===tmod);if(m)for(const ln of String(m.tarefas||'').split('\n').map(x=>x.trim()).filter(Boolean)){const [tt,dd]=ln.split('|').map(x=>x.trim());const n=parseInt(dd);const data=isNaN(n)?'':n<0&&out.dataEvento?addDays(out.dataEvento,n):addDays(today(),Math.abs(n));await save('tarefas',{titulo:tt+' · '+out.titulo,data,feita:false,pedidoId:id,responsavel:out.responsavel||''})}}
      if(out.contatoId){const c=S.data.contatos.find(x=>x.id===out.contatoId);if(c&&c.categoria==='Proposta')await patch('contatos',c.id,{categoria:'Cliente'})}
    }

function eqDoPedido(p){const ks=new Set(eqDoTexto((p.categoria||'')+' '+(p.titulo||'')));(p.itens||[]).forEach(i=>eqDoTexto(nameOf('produtos',i.produtoId)||i.desc||'').forEach(k=>ks.add(k)));return [...ks]}

function u8b64(u8){let s='';const ch=0x8000;for(let i=0;i<u8.length;i+=ch)s+=String.fromCharCode.apply(null,u8.subarray(i,i+ch));return btoa(s)}

async function backupDrive(silent){

  const mcp=await getMcp();if(!mcp){if(!silent)toast('Conectores indisponíveis neste acesso. Abra o CRM no claude.ai.',true);return}

  const B=bkCfg();const iniciou=new Date().toISOString();
  try{let pasta=B.pasta;
    if(!pasta){const r=await mcp.callTool(GD,'create_file',{title:'Backups - CRM Grupo E',contentMimeType:'application/vnd.google-apps.folder'},{cache:false});const pl=parsePayload(r)||{};pasta=pl.id;if(!pasta)throw new Error('O Google Drive não devolveu a pasta.');bkSet({pasta,pastaUrl:pl.viewUrl||''})}
    const nome='Backup CRM Grupo E - '+hojeArq();
    S.bkMsg='Enviando dados para o Google Drive…';if(S.ui.view==='backup')render();
    const D=dadosBackup();const LIM=window.__HOSTED?8000000:600000;
    const partes=[];const addParte=(nome,obj)=>partes.push({nome,obj});
    addParte('00 config e resumo',{sistema:D.sistema,formato:D.formato,geradoEm:D.geradoEm,config:D.config,configFinanceiro:D.configFinanceiro,resumo:D.resumo});

    const anos={};Object.entries(D.financeiroHistorico||{}).forEach(([k,v])=>{const a=String(k).slice(0,4);(anos[a]=anos[a]||{})[k]=v});
    Object.entries(anos).forEach(([a,o])=>addParte('financeiro historico '+a,{financeiroHistorico:o}));
    const envios=[];
    for(const pt of partes){let fila=[pt];while(fila.length){const x=fila.shift();const gz=await gzip(JSON.stringify(x.obj));const b64=u8b64(gz);
      if(b64.length>LIM){const rows=x.obj.rows,fh=x.obj.financeiroHistorico;
        if(rows&&rows.length>1){const h=Math.ceil(rows.length/2);fila.unshift({nome:x.nome+' b',obj:{...x.obj,rows:rows.slice(h)}},{nome:x.nome+' a',obj:{...x.obj,rows:rows.slice(0,h)}});continue}
        if(fh&&Object.keys(fh).length>1){const ks=Object.keys(fh).sort();const h=Math.ceil(ks.length/2);fila.unshift({nome:x.nome+' b',obj:{financeiroHistorico:Object.fromEntries(ks.slice(h).map(k=>[k,fh[k]]))}},{nome:x.nome+' a',obj:{financeiroHistorico:Object.fromEntries(ks.slice(0,h).map(k=>[k,fh[k]]))}});continue}}

    S.bkMsg='Criando pasta do backup…';if(S.ui.view==='backup')render();
    const rf=await mcp.callTool(GD,'create_file',{title:nome,parentId:pasta,contentMimeType:'application/vnd.google-apps.folder'},{cache:false});const sub=(parsePayload(rf)||{}).id||pasta;
    let k=0;for(const en of envios){k++;S.bkMsg=`Enviando ${k} de ${envios.length}…`;if(S.ui.view==='backup')render();
      await mcp.callTool(GD,'create_file',{title:en.nome+'.json.gz',parentId:sub,contentMimeType:'application/gzip',disableConversionToGoogleType:true,base64Content:en.b64},{cache:false});await sleep(400)}

    if(fazX){try{S.bkMsg='Enviando planilha Excel…';if(S.ui.view==='backup')render();
      const buf=await planilhaBackup();const b64=u8b64(new Uint8Array(buf));
      if(b64.length>(window.__HOSTED?40000000:LIM*2.5))throw new Error('a planilha completa ficou grande demais para o envio automático; use "Baixar backup completo (Excel)"');
      await mcp.callTool(GD,'create_file',{title:nome+'.xlsx',parentId:sub,contentMimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',disableConversionToGoogleType:true,base64Content:b64},{cache:false});
      bkSet({ultimoXlsx:iniciou})}catch(e2){xErr=(e2&&e2.message)||String(e2);bkSet({ultimoErro:new Date().toISOString()+' · Dados salvos; só a planilha Excel não subiu: '+xErr})}}
    if(!silent)toast(xErr?'Dados salvos no Drive; a planilha Excel falhou (veja o aviso).':'Backup salvo no seu Google Drive.',!!xErr)}
  catch(e){const msg=(e&&e.code==='server_not_connected')?'Google Drive não está conectado no claude.ai.':((e&&e.message)||String(e));bkSet({ultimoErro:new Date().toISOString()+' · '+msg});if(!silent)toast('Backup falhou: '+msg,true)}
  finally{BK_RUN=false;S.bkMsg='';if(S.ui.view==='backup')render()}}

  const o={};const kT=pick('to','toRecipients','to_recipients','recipients','recipient')||'to';o[kT]=(P[kT]&&P[kT].type==='array')?[para]:para;

function rpCalc(de,ate){const V=S.ui.rp;const dOf=p=>V.base==='evento'?(p.dataEvento||p.emissao||(p.criadoEm||'').slice(0,10)):(p.emissao||(p.criadoEm||'').slice(0,10));
  const prods=Object.fromEntries(S.data.produtos.map(x=>[x.id,x]));const m={};
  const add=(k,emp,v,custo,p,pid)=>{const r=m[k]||(m[k]={k,emp:new Set(),v:0,custo:0,ped:new Set(),ult:'',pid:pid||'',ids:[]});emp.forEach(e=>r.emp.add(e));r.v+=v;r.custo+=custo;if(!r.ped.has(p.id)){r.ped.add(p.id);r.ids.push(p.id)}const d=dOf(p)||'';if(d>r.ult)r.ult=d};
  let tot=0,n=0;
  S.data.pedidos.forEach(p=>{if(p.contratoStatus==='Cancelado')return;const d=dOf(p);if(!d||d<de||d>ate)return;const T=pedidoTotal(p)||(+p.totalAlboom||0);if(!T)return;n++;tot+=T;
    if(V.grupo==='categoria'){const k=p.categoria||'(sem categoria)';add(k,[PRIME_RX.test(k+' '+(p.titulo||''))?'Prime 360':'Fotografia e Filmagem'],T,0,p);return}
    if(V.grupo==='equip'){const ks=eqDoPedido(p);if(!ks.length){add('(sem equipamento)',['Fotografia e Filmagem'],T,0,p);return}ks.forEach(k=>add(EQ_NOME[k]||k,['Prime 360'],T/ks.length,0,p));return}

    if(!its.length||!bruto){const k=p.categoria||'(pedido sem itens)';add(k,[PRIME_RX.test(k+' '+(p.titulo||''))?'Prime 360':'Fotografia e Filmagem'],T,0,p);return}
    its.forEach(i=>{const pr=prods[i.produtoId];const vi=(+i.qtd||1)*(+i.valor||0)/bruto*T;let k=pr?pr.nome:(i.desc&&i.desc!=='Serviços'?i.desc:(p.categoria||'Serviços (sem produto)'));
      const emp=pr?prodEmp(pr):[PRIME_RX.test(k+' '+(p.titulo||''))?'Prime 360':'Fotografia e Filmagem'];add(k,emp,vi,pr&&pr.custo?(+pr.custo)*(+i.qtd||1):0,p,pr&&pr.id)})});

  const sep=tit.match(/^(.*?)\s+[-–·]\s+(.*)$/);const pre=sep?sep[1]:'',pos=sep?sep[2]:tit;
  let equip='';if(pre&&eqDoTexto(pre).length)equip=pre;else{const ks=ped?eqDoPedido(ped):eqDoTexto(tit);equip=ks.map(k=>(typeof EQ_NOME!=='undefined'&&EQ_NOME[k])||k).join(', ')}

  const locRaw=String(r.local||(ped&&ped.local)||'');const url=(locRaw.match(/https?:\/\/\S+/)||[''])[0];const loc=locRaw.replace(/https?:\/\/\S+/,'').replace(/\s*-\s*-\s*/g,' - ').replace(/^\s*-\s*|\s*-\s*$/g,'').trim();
  const maps=url||(loc?'https://maps.google.com/?q='+encodeURIComponent(loc):'');
  const ini=r.hora||(ped&&ped.horaEvento)||'',fim=r.horaFim||'';let dur='';if(ini&&fim){let m=(+fim.slice(0,2)*60+ +fim.slice(3,5))-(+ini.slice(0,2)*60+ +ini.slice(3,5));if(m<0)m+=1440;const h=m/60;dur=` (serão ${String(+h.toFixed(1)).replace('.',',')} hora${h===1?'':'s'})`}

  await patch('agenda',ev.id,{gcal:{id,cal,sig,emails,em:now()}});return 'criado'}

  catch(e){er++;S.gcErro=(e&&e.message)||String(e)}

/* ===== listas grandes (select) com busca ao digitar ===== */
(function(){const MIN=15;let pop=null,alvo=null;
  const fechar=()=>{if(pop){pop.remove();pop=null}if(alvo){const a=alvo;alvo=null;try{a.focus()}catch(_){}}};
  const norm=t=>String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  function abrir(sel,q){if(pop)fechar();alvo=sel;const r=sel.getBoundingClientRect();const opts=[...sel.options];
    pop=document.createElement('div');pop.className='sbx';
    const w=Math.max(r.width,260),left=Math.min(r.left,innerWidth-w-8),abaixo=innerHeight-r.bottom>300||r.top<300;
    pop.style.cssText=`position:fixed;z-index:10050;left:${Math.max(8,left)}px;width:${w}px;${abaixo?'top:'+(r.bottom+2)+'px':'bottom:'+(innerHeight-r.top+2)+'px'};background:var(--surface,#fff);color:var(--fg,#1c1f1d);border:1px solid var(--line,#ccc);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;max-height:320px;font-size:14px`;
    pop.innerHTML=`<input type="text" placeholder="Digite para procurar…" style="margin:6px;padding:8px 10px;border:1px solid var(--line,#ccc);border-radius:6px;font:inherit;background:var(--bg,#fff);color:inherit"><div class="sbx-l" style="overflow:auto;flex:1"></div>`;
    document.body.appendChild(pop);const inp=pop.querySelector('input'),lst=pop.querySelector('.sbx-l');let vis=[],ati=0;
    const pinta=()=>{const t=norm(inp.value).split(/\s+/).filter(Boolean);vis=opts.filter(o=>!o.disabled&&(!t.length||t.every(x=>norm(o.text).includes(x))));
      ati=Math.max(0,vis.findIndex(o=>o.value===sel.value&&!t.length));if(t.length)ati=0;
      lst.innerHTML=vis.length?vis.map((o,i)=>`<div data-i="${i}" style="padding:7px 12px;cursor:pointer;white-space:pre${i===ati?';background:var(--accent,#1f6f54);color:#fff':''}">${o.text.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))||'&nbsp;'}</div>`).join(''):'<div style="padding:8px 12px;opacity:.6">Nada encontrado</div>';
      const a=lst.children[ati];if(a&&a.scrollIntoView)a.scrollIntoView({block:'nearest'})};
    const escolhe=i=>{const o=vis[i];if(!o)return;sel.value=o.value;fechar();sel.dispatchEvent(new Event('input',{bubbles:true}));sel.dispatchEvent(new Event('change',{bubbles:true}))};
    inp.value=q||'';pinta();inp.focus();
    inp.addEventListener('input',pinta);
    inp.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){ati=Math.min(vis.length-1,ati+1);pinta2()}else if(e.key==='ArrowUp'){ati=Math.max(0,ati-1);pinta2()}else if(e.key==='Enter'){e.preventDefault();escolhe(ati)}else if(e.key==='Escape'||e.key==='Tab'){e.preventDefault();fechar()}else return;e.preventDefault()});
    function pinta2(){[...lst.children].forEach((d,i)=>{d.style.background=i===ati?'var(--accent,#1f6f54)':'';d.style.color=i===ati?'#fff':''});const a=lst.children[ati];if(a)a.scrollIntoView({block:'nearest'})}
    lst.addEventListener('mousedown',e=>{const d=e.target.closest('[data-i]');if(d){e.preventDefault();escolhe(+d.dataset.i)}})}
  const grande=t=>t&&t.tagName==='SELECT'&&!t.multiple&&!t.disabled&&t.options.length>=MIN;
  document.addEventListener('mousedown',e=>{if(pop&&!pop.contains(e.target)){fechar()}const t=e.target;if(grande(t)){e.preventDefault();t.focus();abrir(t,'')}},true);
  document.addEventListener('keydown',e=>{const t=e.target;if(!grande(t)||e.ctrlKey||e.metaKey||e.altKey)return;
    if(e.key.length===1&&e.key!==' '){e.preventDefault();abrir(t,e.key)}else if(e.key==='Enter'||e.key===' '||(e.key==='ArrowDown'&&e.altKey)){e.preventDefault();abrir(t,'')}},true);
  window.addEventListener('resize',()=>{if(pop)fechar()});document.addEventListener('scroll',e=>{if(pop&&!pop.contains(e.target))fechar()},true);
})();

function loteMatch(nome,P){const nums=new Set(P.map(p=>String(p.num)));
  let m=nome.match(/#\s*(\d{3,5})/);if(m&&nums.has(m[1]))return {num:m[1],como:'numero'};

function moneyFmt(v){if(v===''||v==null||isNaN(+v))return '';return (+v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function moneyParse(t){t=String(t||'').replace(/[^\d,]/g,'');const [a,b='']=t.split(',');return +(a||'0')+(b?+('0.'+b.slice(0,2)):0)}
function moneyMask(el,ev){let v=el.value;const pos=el.selectionStart||v.length;
  const sep=ev&&ev.inputType==='insertText'&&(ev.data==='.'||ev.data===',');
  if(sep){if(ev.data===',')el.dataset.vrg='1';else if(!el.value.slice(0,pos-1).includes(','))el.dataset.vrg='';v=v.slice(0,pos-1)+'#'+v.slice(pos)}
  if(!v.replace(/\D/g,''))el.dataset.vrg='';
  v=v.replace(/,/g,'#');if((v.match(/#/g)||[]).length>1){const i0=v.lastIndexOf('#');v=v.slice(0,i0)+v.slice(i0+1)}let k=v.indexOf('#');let a=(k<0?v:v.slice(0,k)).replace(/\D/g,''),braw=k<0?'':v.slice(k+1).replace(/\D/g,'');
  /* ponto digitado como milhar (ex.: 1.712): com 3 dígitos depois do ponto, vira número inteiro */
  if(k>=0&&braw.length>2&&el.dataset.vrg!=='1'){a=a+braw;braw='';k=-1;v=a}
  let b=braw.slice(0,2);
  a=a.replace(/^0+(?=\d)/,'');if(k>=0&&!a)a='0';const fa=a.replace(/\B(?=(\d{3})+(?!\d))/g,'.');const out=fa+(k>=0?','+b:'');
  const fim=el.value.length-pos;el.value=out;let c=Math.max(0,out.length-fim);if(ev&&ev.inputType==='insertText'&&(ev.data==='.'||ev.data===','))c=out.indexOf(',')+1;try{el.setSelectionRange(c,c)}catch(_){}}

const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC_T[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
async function zipUm(nome,str){const raw=new TextEncoder().encode(str);const st=new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'));const comp=new Uint8Array(await new Response(st).arrayBuffer());
  const nm=new TextEncoder().encode(nome),crc=crc32(raw);const lh=new DataView(new ArrayBuffer(30));
  lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,8,true);lh.setUint32(14,crc,true);lh.setUint32(18,comp.length,true);lh.setUint32(22,raw.length,true);lh.setUint16(26,nm.length,true);
  const cd=new DataView(new ArrayBuffer(46));cd.setUint32(0,0x02014b50,true);cd.setUint16(4,20,true);cd.setUint16(6,20,true);cd.setUint16(8,0x0800,true);cd.setUint16(10,8,true);cd.setUint32(16,crc,true);cd.setUint32(20,comp.length,true);cd.setUint32(24,raw.length,true);cd.setUint16(28,nm.length,true);
  const off=30+nm.length+comp.length;const cdl=46+nm.length;const end=new DataView(new ArrayBuffer(22));end.setUint32(0,0x06054b50,true);end.setUint16(8,1,true);end.setUint16(10,1,true);end.setUint32(12,cdl,true);end.setUint32(16,off,true);
  const out=new Uint8Array(off+cdl+22);let o=0;const put=b=>{out.set(b,o);o+=b.length};put(new Uint8Array(lh.buffer));put(nm);put(comp);put(new Uint8Array(cd.buffer));put(nm);put(new Uint8Array(end.buffer));return out}
async function exportarMigracao(){if(S.mode!=='db'){toast('Abra o CRM no claude.ai para exportar.',true);return}if(S.migRun)return;S.migRun=true;
  const cols=[...new Set([...COLS,...XCOLS,'fin','config','contratosAlb','historicoAlb'])];const out={};let tot=0;
  try{for(const c of cols){S.migMsg='Lendo '+c+'…';render();let snap;for(let t=0;;t++){try{snap=await S.db.collection(c).get();break}catch(e){if(t>4)throw e;await sleep(1500*(t+1))}}
      out[c]=snap.docs.map(d=>({...d.data(),id:d.id}));tot+=out[c].length}
    S.migMsg='Compactando…';render();
    const gz=await zipUm('migracao.json',JSON.stringify({sistema:'CRM Grupo E',formato:'migracao',geradoEm:new Date().toISOString(),resumo:Object.fromEntries(cols.map(c=>[c,out[c].length])),colecoes:out}));

  catch(e){S.migMsg='';S.migRun=false;render();toast('Não consegui exportar: '+((e&&e.message)||e),true)}}
document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('[data-bkmigra]');if(!t)return;e.preventDefault();exportarMigracao()});

const HIST_TIPO={finance:'Financeiro',proofs:'Provas',orders:'Pedido',leads:'Oportunidade',contact:'Contato',contacts:'Contato',events:'Agenda',projects:'Projeto',admin:'Sistema',products:'Produtos',agreements:'Contrato',quotes:'Proposta'};
async function histAlb(num){if(S.mode!=='db')return null;const out=[];try{let i=1;while(i<40){const d=await S.db.collection('historicoAlb').doc('h-'+num+(i===1?'':'~'+i)).get();if(!d.exists)break;out.push(...(d.data().itens||[]));const p=d.data().partes||1;if(i>=p)break;i++}}catch(e){return null}return out}
function histLista(L,lim){if(L===null)return '<span class="muted">Não consegui carregar agora.</span>';if(!L.length)return '<span class="muted">Nada registrado.</span>';
  const row=it=>{const nota=/^Anota/.test(it[5]||'');return `<div style="display:grid;grid-template-columns:118px minmax(0,1fr);gap:8px;padding:5px 0;border-bottom:1px solid var(--line)"><span class="num muted" style="font-size:12px">${esc(fdate((it[0]||'').slice(0,10)))} ${esc((it[0]||'').slice(11,16))}</span><span style="font-size:13px;${nota?'background:color-mix(in srgb,var(--warn) 10%,transparent);padding:4px 6px;border-radius:6px':''}">${nota?'<b>📝 Anotação</b> · ':''}${esc(it[4]||'')}${it[5]&&!nota?' <span class="muted">('+esc(it[5])+')</span>':''} <span class="muted" style="font-size:11.5px">· ${esc(HIST_TIPO[it[1]]||it[1]||'')}${it[3]?' · '+esc(it[3]):''}</span></span></div>`};
  const notas=L.filter(it=>/^Anota/.test(it[5]||''));const outros=L.filter(it=>!/^Anota/.test(it[5]||''));
  return (notas.length?notas.map(row).join(''):'')+outros.slice(0,lim).map(row).join('')+(outros.length>lim?`<button type="button" class="clink" data-histmais="${lim+200}" style="margin-top:6px">Ver mais ${Math.min(200,outros.length-lim)} de ${outros.length-lim} restantes</button>`:'')}
const _histCache={};
new MutationObserver(()=>{document.querySelectorAll('[data-histalb]:not([data-ok])').forEach(async el=>{el.setAttribute('data-ok','1');const num=el.dataset.histalb;let L=_histCache[num]||(_histCache[num]=await histAlb(num));if(L&&el.dataset.histped){const pn=+el.dataset.histped;L=L.filter(it=>(it[1]==='orders'&&+it[2]===pn)||(/^Anota/.test(it[5]||'')&&it[1]==='orders'&&+it[2]===pn))}el._L=L;el.classList.remove('muted');el.style.maxHeight='420px';el.style.overflow='auto';el.innerHTML=histLista(L,80)});
  document.querySelectorAll('[data-ctalbc]:not([data-ok])').forEach(async el=>{el.setAttribute('data-ok','1');const L=await ctAlbDe('contatoNum',+el.dataset.ctalbc);(L||[]).forEach(c=>_ctAlbCache[c.id]=c);el.classList.remove('muted');el.innerHTML=ctAlbLista(L)})}).observe(document.body,{childList:true,subtree:true});

/* ---- listas longas: abrir com campo de busca (digitar procura em qualquer parte do nome) ---- */
(function(){const MIN=12;let cur=null;
  const norm=x=>String(x||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  const elegivel=el=>el&&el.tagName==='SELECT'&&!el.multiple&&!el.disabled&&!el.hasAttribute('data-nativo')&&el.options.length>MIN;
  function fechar(foco){if(!cur)return;const sel=cur.sel;cur.box.remove();document.removeEventListener('mousedown',fora,true);window.removeEventListener('resize',pos);cur=null;if(foco)try{sel.focus()}catch(_){}}
  function fora(e){if(cur&&!cur.box.contains(e.target)&&e.target!==cur.sel)fechar(false)}
  function pos(){if(!cur)return;const r=cur.sel.getBoundingClientRect(),vh=innerHeight,w=Math.max(r.width,300);const left=Math.max(8,Math.min(r.left,innerWidth-w-8));const abaixo=vh-r.bottom-12,acima=r.top-12;const up=abaixo<260&&acima>abaixo;const h=Math.min(380,up?acima:abaixo);
    Object.assign(cur.box.style,{left:left+'px',width:Math.min(w,innerWidth-16)+'px',maxHeight:h+'px',top:up?'':(r.bottom+4)+'px',bottom:up?(vh-r.top+4)+'px':''})}
  function abrir(sel,txt){fechar(false);const box=document.createElement('div');box.className='ssel';box.innerHTML='<input type="search" placeholder="Digite para procurar…" aria-label="Procurar"><ul role="listbox"></ul>';document.body.appendChild(box);
    const inp=box.querySelector('input'),ul=box.querySelector('ul');cur={sel,box,inp,ul,i:-1,vis:[]};
    const opts=[...sel.options].map((o,k)=>({k,t:o.text,n:norm(o.text),dis:o.disabled,v:o.value}));
    const lista=()=>{const q=norm(inp.value).trim().split(/\s+/).filter(Boolean);cur.vis=opts.filter(o=>q.every(w=>o.n.includes(w)));
      ul.innerHTML=cur.vis.length?cur.vis.map((o,j)=>`<li data-j="${j}" class="${o.k===sel.selectedIndex?'on':''}${o.dis?' dis':''}${/^\s*\d+(\.\d+)?\s-\s/.test(o.t)&&!/^\s*\d+\.\d+\.\d+/.test(o.t)?' grp':''}">${esc(o.t.trim()?o.t:'—')}</li>`).join(''):'<div class="nada">Nada encontrado.</div>';
      cur.i=q.length?cur.vis.findIndex(o=>!o.dis):cur.vis.findIndex(o=>o.k===sel.selectedIndex);marca()};
    const marca=()=>{ul.querySelectorAll('li').forEach((li,j)=>li.classList.toggle('on',j===cur.i));const a=ul.querySelector('li.on');if(a)a.scrollIntoView({block:'nearest'})};
    const escolher=j=>{const o=cur.vis[j];if(!o||o.dis)return;if(sel.selectedIndex!==o.k){sel.selectedIndex=o.k;sel.dispatchEvent(new Event('input',{bubbles:true}));sel.dispatchEvent(new Event('change',{bubbles:true}))}fechar(true)};
    inp.addEventListener('input',lista);
    inp.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();cur.i=Math.min(cur.vis.length-1,cur.i+1);marca()}else if(e.key==='ArrowUp'){e.preventDefault();cur.i=Math.max(0,cur.i-1);marca()}else if(e.key==='Enter'){e.preventDefault();escolher(cur.i)}else if(e.key==='Escape'||e.key==='Tab'){e.preventDefault();fechar(true)}});
    ul.addEventListener('mousedown',e=>{const li=e.target.closest('li');if(li){e.preventDefault();escolher(+li.dataset.j)}});
    inp.value=txt||'';lista();pos();document.addEventListener('mousedown',fora,true);window.addEventListener('resize',pos);inp.focus();const L=inp.value.length;try{inp.setSelectionRange(L,L)}catch(_){}setTimeout(()=>{if(cur&&cur.inp===inp&&document.activeElement!==inp)inp.focus()},0)}
  document.addEventListener('mousedown',e=>{const el=e.target;if(e.button!==0||!elegivel(el))return;e.preventDefault();if(cur&&cur.sel===el){fechar(true);return}el.focus();abrir(el,'')},true);
  document.addEventListener('keydown',e=>{const el=e.target;if(!elegivel(el)||cur||e.ctrlKey||e.metaKey||e.altKey)return;
    if(e.key.length===1&&e.key!==' '){e.preventDefault();abrir(el,e.key)}else if(e.key==='Enter'||e.key===' '||(e.key==='ArrowDown'&&e.altKey)){e.preventDefault();abrir(el,'')}},true);
  document.addEventListener('scroll',e=>{if(cur&&!cur.box.contains(e.target))pos()},true);
})();
