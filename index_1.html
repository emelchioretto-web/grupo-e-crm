<style>
:root{--bg:#f3f4f3;--surface:#fff;--fg:#1b2120;--muted:#5d6764;--line:#dfe3e1;--accent:#1f6f54;--side:#111514;--side-fg:#cfd6d3;--ok:#2c7a4e;--warn:#a2600e;--danger:#b23a31;--r:14px;
  --f-display:"Bodoni Moda",Georgia,serif;--f-body:"Karla",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
a{color:inherit}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-fg);position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.logo{background:#000;padding:22px 18px;display:grid;place-items:center}.logo img{max-width:180px;max-height:92px;filter:invert(1)}
.nav{display:grid;padding:10px 0}.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 22px;font-weight:600;font-size:15px;border-left:3px solid transparent}
.nav button:hover{background:#1b2120;color:#fff}.nav button.on{background:#1b2120;color:#fff;border-left-color:#8dc4ab}.nav .n{margin-left:auto;font-size:12px;background:#2a3230;border-radius:10px;padding:0 8px}
.side .foot{margin-top:auto;padding:16px 22px;font-size:12.5px;color:#8e9a96}.side .foot a{display:inline-flex;gap:6px;align-items:center;margin-top:6px;color:#cfd6d3;text-decoration:none;font-weight:600}
main{padding:28px 32px 60px;min-width:0}
.hello{background:var(--surface);border-radius:var(--r);padding:22px 26px;margin-bottom:20px;border:1px solid var(--line)}
.hello h1{font-family:var(--f-display);font-weight:500;font-size:30px;margin:0 0 4px}.hello p{margin:0;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{all:unset;cursor:pointer;border-radius:var(--r);padding:18px 20px;color:#fff;display:flex;justify-content:space-between;align-items:center;min-height:92px;box-shadow:0 2px 10px rgba(0,0,0,.06);transition:transform .12s}
.tile:hover{transform:translateY(-2px)}.tile .ic{font-size:38px;opacity:.85}.tile .t{text-align:right}.tile .t span{display:block;font-size:13.5px;opacity:.95}.tile .t b{font-size:26px;font-weight:700}
.t1{background:#e9a35a}.t2{background:#2a77c2}.t3{background:#2a77c2}.t4{background:#e9a35a}.t5{background:#d9533e}.t6{background:#3fb3cf}
h2{font-family:var(--f-display);font-weight:500;font-size:26px;margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:12px}
.gals{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.gal{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:block;transition:box-shadow .12s}.gal:hover{box-shadow:0 6px 20px rgba(0,0,0,.1)}
.gal .cv{aspect-ratio:3/2;background:#e6e9e8 center/cover no-repeat;display:grid;place-items:center;color:#9aa4a1;font-size:34px}
.gal .b{padding:12px 14px}.gal .nm{font-weight:700;color:#1f5f9e}.gal .mt{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:8px;padding:1px 8px;background:#eef1f0}.ok{color:var(--ok);background:#e5f3ea}.wn{color:var(--warn);background:#fbefdc}.dg{color:var(--danger);background:#fbe7e5}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.row .v{font-weight:700;white-space:nowrap}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;background:#fff}.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.muted{color:var(--muted)}.sum{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px}.sum .card{flex:1;min-width:180px;margin:0}.sum b{font-size:22px;display:block}
.pix{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#eef6f1;border:1px solid #cfe4d8;border-radius:12px;padding:12px 14px;margin-bottom:14px}
.empty{color:var(--muted);text-align:center;padding:30px}
.msg{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.topm{display:none}
@media(max-width:860px){body{overflow-x:hidden}.app{display:block}.side{position:static;height:auto;display:block}.logo{padding:14px;display:flex;justify-content:center}.logo img{max-height:56px;max-width:60vw}.nav{display:flex;overflow-x:auto;padding:0;-webkit-overflow-scrolling:touch}.nav button{flex:none}main{max-width:100vw}.nav button{padding:12px 14px;border-left:0;border-bottom:3px solid transparent;white-space:nowrap;font-size:14px}.nav button.on{border-bottom-color:#8dc4ab}.side .foot{display:none}main{padding:18px 14px 50px}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{min-height:80px;padding:14px}.tile .ic{font-size:28px}.tile .t b{font-size:21px}.hello h1{font-size:24px}}
</style>
</head>

firebase.initializeApp(CFG);const db=firebase.firestore();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fd=s=>s?String(s).slice(0,10).split('-').reverse().join('/'):'';
const hoje=new Date().toISOString().slice(0,10);
let D=null,tab='inicio';
function slug(){return decodeURIComponent((location.hash||'').slice(1).split('/')[0]).trim()}
async function carregar(){const s=slug();if(!s||s.length<8){msg('Link incompleto. Use o link que recebemos por WhatsApp ou e-mail.');return}
  try{const d=await db.doc('portal/'+s).get();if(!d.exists||!d.data().ativo){msg('Este acesso não está ativo. Fale com a gente pelo WhatsApp.');return}D=d.data();tab=(location.hash.split('/')[1])||'inicio';render()}
  catch(e){msg('Este acesso não está ativo ou o link está incorreto.')}}
function msg(t){document.getElementById('root').innerHTML=`<div class="msg"><div><img src="${LOGO}" alt="" style="max-width:200px;margin-bottom:20px"><p>${esc(t)}</p></div></div>`}
function ir(t){tab=t;history.replaceState(null,'','#'+slug()+(t==='inicio'?'':'/'+t));render();scrollTo(0,0)}
function render(){const g=D.galerias||[],c=D.contratos||[],ag=D.agenda||[],ap=D.aPagar||[],pg=D.pago||[];const E=D.empresa||{};
  const totAP=ap.reduce((s,x)=>s+x.valor,0),totPG=pg.reduce((s,x)=>s+x.valor,0);const futuros=ag.filter(a=>a.data>=hoje);
  const nav=[['inicio','🏠','Início'],['galerias','🖼️','Suas Galerias',g.length],['contratos','📄','Contratos',c.length],['agenda','📅','Agenda',futuros.length],['apagar','💳','A pagar',ap.length],['pago','✅','Pago'],['perfil','👤','Seu perfil']];
  let body='';
  if(tab==='inicio')body=`<div class="hello"><h1>Olá, ${esc(D.primeiro||D.nome)}!</h1><p>Bem-vindo(a) à sua área do cliente. Aqui ficam suas galerias, contratos, agenda e pagamentos.</p></div>
    <div class="tiles">
     <button class="tile t3" onclick="ir('galerias')"><span class="ic">🖼️</span><span class="t"><span>Galerias</span><b>${g.length}</b></span></button>
     <button class="tile t2" onclick="ir('contratos')"><span class="ic">📄</span><span class="t"><span>Contratos</span><b>${c.length}</b></span></button>
     <button class="tile t4" onclick="ir('agenda')"><span class="ic">📅</span><span class="t"><span>Agenda</span><b>${futuros.length}</b></span></button>
     <button class="tile t5" onclick="ir('apagar')"><span class="ic">⬆️</span><span class="t"><span>A pagar</span><b>${brl(totAP).replace('R$','').trim()}</b></span></button>
     <button class="tile t6" onclick="ir('pago')"><span class="ic">⬇️</span><span class="t"><span>Pago</span><b>${brl(totPG).replace('R$','').trim()}</b></span></button>
     <button class="tile t1" onclick="ir('perfil')"><span class="ic">✏️</span><span class="t"><span>Seu perfil</span><b>›</b></span></button></div>
    ${g.filter(x=>!x.concluida&&x.prazo&&x.prazo>=hoje).length?`<div class="card" style="margin-top:18px;border-color:#e9c37c;background:#fff8ea"><b>Você tem galeria esperando sua escolha:</b> ${g.filter(x=>!x.concluida&&x.prazo>=hoje).map(x=>`<a href="${esc(x.link)}">${esc(x.nome)}</a> (prazo ${fd(x.prazo)})`).join(' · ')}</div>`:''}`;
  else if(tab==='galerias')body=`<h2>Suas galerias</h2>${g.length?`<div class="gals">${g.map(x=>{const venc=x.prazo&&x.prazo<hoje&&!x.concluida;return `<a class="gal" href="${esc(x.link)}"><div class="cv" style="${x.capa?`background-image:url('${esc(x.capa)}')`:''}">${x.capa?'':'🖼️'}</div><div class="b"><div class="nm">${esc(x.nome)}</div>
      <div class="mt"><span>#${esc(String(x.num))}</span><span>${x.tipo==='Álbum'?'📘 Aprovação de álbum':x.tipo==='Venda de fotos'?'🛒 Venda de fotos':'▦ '+x.imagens+' imagens'}</span>${x.limite&&x.tipo!=='Álbum'?`<span>✔ ${x.sel}/${x.limite}</span>`:''}</div>
      <div class="mt">${x.concluida?`<span class="badge ok">Concluída${x.concluidaEm?' em '+fd(x.concluidaEm):''}</span>`:venc?`<span class="badge dg">Prazo encerrado ${fd(x.prazo)}</span>`:x.prazo?`<span class="badge wn">Escolher até ${fd(x.prazo)}</span>`:''}</div></div></a>`}).join('')}</div>`:'<div class="card empty">Nenhuma galeria por enquanto.</div>'}`;
  else if(tab==='contratos')body=`<h2>Contratos</h2>${c.length?c.map(x=>`<div class="card"><div class="row"><div><b>${esc(x.titulo)}</b><div class="muted" style="font-size:13.5px">Pedido ${esc(String(x.num))}${x.dataEvento?' · evento em '+fd(x.dataEvento):''}</div></div><span class="badge ${/assinad/i.test(x.status)?'ok':'wn'}">${esc(x.status)}</span></div>
      ${x.assinar||(x.docs||[]).length?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">${x.assinar?`<a class="btn pri" href="${esc(x.assinar)}" target="_blank" rel="noopener">✍️ Assinar contrato</a>`:''}${(x.docs||[]).map((u,i)=>`<a class="btn" href="${esc(u)}" target="_blank" rel="noopener">⬇ Baixar contrato${x.docs.length>1?' '+(i+1):''}</a>`).join('')}</div>`:''}</div>`).join(''):'<div class="card empty">Nenhum contrato por aqui.</div>'}`;
  else if(tab==='agenda')body=`<h2>Agenda</h2>${ag.length?ag.slice().reverse().map(x=>`<div class="card"><div class="row"><div><b>${esc(x.titulo)}</b><div class="muted" style="font-size:13.5px">${x.local?esc(x.local):''}</div></div><span class="v">${fd(x.data)}${x.hora?' · '+esc(x.hora):''}</span></div></div>`).join(''):'<div class="card empty">Nenhum compromisso.</div>'}`;
  else if(tab==='apagar')body=`<h2>A pagar</h2><div class="sum"><div class="card"><span class="muted">Total a pagar</span><b>${brl(totAP)}</b></div><div class="card"><span class="muted">Próximo vencimento</span><b>${ap[0]?fd(ap[0].venc):'—'}</b></div></div>
    ${E.pix&&ap.length?`<div class="pix"><span>Pague por <b>Pix</b>: <b id="pixk">${esc(E.pix)}</b>${E.pixNome?' · '+esc(E.pixNome):''}</span><button class="btn" onclick="navigator.clipboard.writeText(document.getElementById('pixk').textContent).then(()=>this.textContent='Copiado!')">Copiar chave</button></div>`:''}
    ${ap.length?ap.map(x=>`<div class="card"><div class="row"><div><b>${esc(x.desc)}</b><div class="muted" style="font-size:13.5px">Vencimento ${fd(x.venc)}${x.venc<hoje?' · <span style="color:var(--danger);font-weight:700">vencida</span>':''}</div></div><span class="v">${brl(x.valor)}</span></div></div>`).join(''):'<div class="card empty">Nada a pagar. Obrigado!</div>'}`;
  else if(tab==='pago')body=`<h2>Pago</h2><div class="sum"><div class="card"><span class="muted">Total pago</span><b>${brl(totPG)}</b></div></div>${pg.length?pg.map(x=>`<div class="card"><div class="row"><div><b>${esc(x.desc)}</b><div class="muted" style="font-size:13.5px">Pago em ${fd(x.dataPag||x.venc)}${x.forma?' · '+esc(x.forma):''}</div></div><span class="v">${brl(x.valor)}</span></div></div>`).join(''):'<div class="card empty">Nenhum pagamento registrado ainda.</div>'}`;
  else if(tab==='perfil'){const P=D.perfil||{};const wa=E.wa?`https://wa.me/${E.wa}?text=${encodeURIComponent('Olá! Quero atualizar meus dados de cadastro.')}`:'';
    body=`<h2>Seu perfil</h2><div class="card"><div style="display:grid;gap:8px"><div><span class="muted">Nome</span><br><b>${esc(D.nome)}</b></div>${P.email?`<div><span class="muted">E-mail</span><br><b>${esc(P.email)}</b></div>`:''}${P.celular?`<div><span class="muted">Celular</span><br><b>${esc(P.celular)}</b></div>`:''}${P.cidade?`<div><span class="muted">Cidade</span><br><b>${esc(P.cidade)}</b></div>`:''}</div>
     ${wa?`<div style="margin-top:14px"><a class="btn pri" href="${wa}" target="_blank" rel="noopener">💬 Pedir alteração pelo WhatsApp</a></div>`:''}</div>`}
  const waF=E.wa?`<a href="https://wa.me/${E.wa}" target="_blank" rel="noopener">💬 Falar com a gente</a>`:'';
  document.getElementById('root').innerHTML=`<div class="app"><aside class="side"><div class="logo"><img src="${LOGO}" alt="${esc(E.nome||'')}"></div>
   <nav class="nav">${nav.map(([k,i,l,n])=>`<button class="${tab===k?'on':''}" onclick="ir('${k}')"><span>${i}</span>${l}${n?`<span class="n">${n}</span>`:''}</button>`).join('')}</nav>
   <div class="foot">${esc(E.nome||'')}<br>${waF}</div></aside><main>${body}
   <p class="muted" style="font-size:12px;margin-top:26px">Atualizado em ${new Date(D.atualizadoEm).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})} · ${esc(E.nome||'')}${E.wa?` · <a href="https://wa.me/${E.wa}" target="_blank" rel="noopener">WhatsApp</a>`:''}</p></main></div>`}
addEventListener('hashchange',()=>{if(!D||(location.hash.slice(1).split('/')[0]!==slug()))carregar();else{tab=location.hash.split('/')[1]||'inicio';render()}});
carregar();
</script>
</body>
</html>
